        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }

        #jailbreakBtn:disabled { background-color: rgba(128, 128, 128, 0.15); color: #888888; border-color: #888888; cursor: not-allowed; opacity: 0.5; box-shadow: none; }

        .payload-container {

            z-index: 10;
        }
        .btn-payload {
            background-color: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            border: 2px solid #ff8c00;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.2);

        }
        .btn-payload:hover {
            background-color: #ff8c00;
            color: #000000;

        }
        .btn-payload:active {

        .phoenix-container {

            z-index: 1; 
            mix-blend-mode: screen; 
            animation: pulse-glow-only 2.5s infinite ease-in-out; 
            margin: 2vh auto;    
        }

        .phoenix-layer { 
            width: 100%; 
            height: 100%; 
            background-image: url('icon0.png'); 
            background-size: contain; 
            background-repeat: no-repeat; 
            background-position: center; 
        }

        @keyframes pulse-glow-only { 0% { filter: drop-shadow(0 0 15px rgba(255, 140, 0, 0.6)); } 50% { filter: drop-shadow(0 0 35px rgba(255, 140, 0, 0.9)); } 100% { filter: drop-shadow(0 0 15px rgba(255, 140, 0, 0.6)); } }

        /* ======================================= */
        /* RESPONSIVE SIDE BUTTONS COMPONENT       */
        /* ======================================= */
        .side-wrapper { 
            position: fixed; 
            top: 50%; 
            transform: translateY(-50%); 
            display: flex; 
            flex-direction: column;      
            gap: 4vh;                    
            z-index: 10; 
        }

        .left-side { left: 4vw; } 
        .right-side { right: 4vw; }

        .ps-icon-side { 
            width: 6vw;                  
            max-width: 55px; 
            min-width: 35px; 
            height: auto; 
        }

        .tri { filter: drop-shadow(0 0 15px #4caf50); } 
        .squ { filter: drop-shadow(0 0 15px #e91e63); } 
        .cir { filter: drop-shadow(0 0 15px #ff5722); } 
        .cro { filter: drop-shadow(0 0 15px #2196f3); }

        /* ======================================================= */
        /* CONSOLE BOX: NEON ORANGE BOTTOM LINE WITH SMOOTH FADE   */
        /* ======================================================= */
        #console-box { 
            background: transparent; 
            border: none; 
            border-bottom: 2px solid #ff8c00; 
            width: 90%; 
            height: 160px; 
            z-index: 10; 
            overflow: hidden; 
            box-sizing: border-box; 
            position: relative;
            box-shadow: 0px 12px 20px -6px rgba(255, 140, 0, 0.5); 

            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
        }

        #console {
            position: absolute;
            bottom: 10px; 
            left: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            margin: 0; 
            padding: 0; 
            font-family: monospace; 
            font-size: 14px; 
            text-align: left;
        }

        .log-line {
            display: block;
            animation: moveUpLinear 4s forwards linear;
            opacity: 1;
            transform: translateY(0);
            line-height: 1.6;
            font-weight: bold;
        }

        @keyframes moveUpLinear {
            0% { transform: translateY(30px); }
            10% { transform: translateY(0); }
            100% { transform: translateY(-140px); }
        }

        footer { margin-top: 15px; font-size: 12px; color: #666; z-index: 10; text-align: center; }
        footer strong { color: #aaa; }

        @media (max-width: 768px) {
            .side-wrapper {
                flex-direction: row;     
                top: auto;
                bottom: 2vh;
                transform: none;
                gap: 15px;
            }
            .left-side { left: 5%; }
            .right-side { right: 5%; }
            .phoenix-container { margin-top: 4vh; }
        }
    </style>
    <script>
        if (window.applicationCache && (window.applicationCache.status == '0' || window.applicationCache.status == '3')) {
            window.location.replace("cache.html");
        }
    </script>
</head>
