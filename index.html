<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no" manifest="psfree_lapse.cache">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHOENIX GAME</title>
    
    <!-- Load stable exploit bundle from Feyzee repository -->
    <script src="./bundle.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }

        body {
            background-image: url('bg.jpg'); 
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 25px;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #ffffff;
            font-size: 32px;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 140, 0, 0.8);
            z-index: 10;
        }

        .subtitle {
            color: #aaaaaa;
            font-size: 16px;
            margin-bottom: 20px;
            letter-spacing: 2px;
            z-index: 10;
        }

        /* Top Bird Trigger Button Container */
        .btn-bird-container {
            width: 110px;
            height: 110px;
            z-index: 10;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #jailbreak-btn {
            width: 100%;
            height: 100%;
            background-image: url('click_bird.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            opacity: 1;
            transition: transform 0.3s ease, filter 0.3s ease;
            filter: drop-shadow(0 0 15px rgba(0, 92, 248, 0.6));
        }

        #jailbreak-btn:not(:disabled):hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 30px rgba(0, 92, 248, 1)) !important;
        }

        #jailbreak-btn:disabled {
            cursor: not-allowed;
            opacity: 0.3;
            filter: grayscale(100%) drop-shadow(0 0 2px rgba(128, 128, 128, 0.5)) !important;
        }

        /* Side-by-Side Flex Layout Container */
        .main-layout {
            display: flex;
            width: 94%;
            max-width: 1200px;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            z-index: 5;
        }

        /* LEFT SIDE: Sci-Fi Console Box with Intelligent Frame Slicing */
        #console-box {
            width: 520px; 
            height: 320px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            
            /* Secure structural boundaries for the custom frame image */
            border: 24px solid transparent;
            border-image-source: url('frame.png');
            border-image-slice: 30 35 30 35 fill;
            border-image-repeat: round;
            
            /* Applied smart CSS tint matrix to switch purple frame to vibrant Neon Blue */
            filter: hue-rotate(110deg) saturate(150%) drop-shadow(0 0 25px rgba(0, 92, 248, 0.85));
            animation: neon-blue-pulse 3s infinite ease-in-out;
        }

        /* Transparent Black Internal Menu Container fixed behind the borders */
        .console-internal-menu {
            width: 100%;
            height: 100%;
            background-color: rgba(6, 6, 8, 0.82); 
            backdrop-filter: blur(8px); 
            border-radius: 4px;
            padding: 15px;
            overflow-y: auto;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            font-weight: bold;
            color: #00ffcc; 
            background-clip: padding-box; /* CRITICAL: Prevent dark background from overlaying the frame.png */
        }

        /* Custom Scrollbar for the internal log panel */
        .console-internal-menu::-webkit-scrollbar {
            width: 5px;
        }
        .console-internal-menu::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        .console-internal-menu::-webkit-scrollbar-thumb {
            background: #005cf8;
            border-radius: 4px;
        }

        /* RIGHT SIDE: Phoenix Center Bird shifted completely to the Right */
        .phoenix-container {
            width: 440px; 
            height: 440px;
            mix-blend-mode: screen; 
            animation: pulse-glow-only 2.5s infinite ease-in-out;
        }

        .phoenix-layer {
            width: 100%;
            height: 100%;
            background-image: url('icon0.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* Keyframes Animations */
        @keyframes neon-blue-pulse {
            0% { filter: hue-rotate(110deg) saturate(150%) drop-shadow(0 0 15px rgba(0, 92, 248, 0.6)); }
            50% { filter: hue-rotate(110deg) saturate(170%) drop-shadow(0 0 35px rgba(0, 92, 248, 1)); }
            100% { filter: hue-rotate(110deg) saturate(150%) drop-shadow(0 0 15px rgba(0, 92, 248, 0.6)); }
        }

        @keyframes pulse-glow-only {
            0% { filter: drop-shadow(0 0 15px rgba(255, 69, 0, 0.5)); }
            50% { filter: drop-shadow(0 0 40px rgba(255, 69, 0, 0.8)); }
            100% { filter: drop-shadow(0 0 15px rgba(255, 69, 0, 0.5)); }
        }

        /* Floating Accent Elements */
        .side-wrapper {
            position: fixed;
            top: 45%; 
            display: flex;
            gap: 25px;
            z-index: 2;
            opacity: 0.6;
        }
        .left-side { left: 2%; }
        .right-side { right: 2%; }
        .ps-icon-side { width: 48px; height: 48px; }
        .tri { filter: drop-shadow(0 0 10px #4caf50); } 
        .squ { filter: drop-shadow(0 0 10px #e91e63); } 
        .cir { filter: drop-shadow(0 0 10px #ff5722); } 
        .cro { filter: drop-shadow(0 0 10px #2196f3); } 

        .writing-layer {
            position: fixed;
            bottom: 15px;
            width: 320px;
            height: auto;
            object-fit: contain;
            z-index: 10;
            filter: drop-shadow(0 0 15px #ffd700);
        }
    </style>
    <script>
        if (window.applicationCache && window.applicationCache.status === 0) { 
            window.location.replace("cache.html");
        }
    </script>
</head>
<body class="notranslate">

    <h1>PHOENIX HOST</h1>
    <div class="subtitle">7.00 - 9.60</div>

    <!-- Active Top Bird Trigger Button -->
    <div class="btn-bird-container">
        <button id="jailbreak-btn" title="Click this Bird to Exploit"></button>
    </div>

    <!-- MAIN INTERACTIVE LAYOUT -->
    <div class="main-layout">
        
        <!-- LEFT ELEMENT: Custom Neon Sci-Fi Frame Console -->
        <div id="console-box">
            <div class="console-internal-menu" id="messages">
                System Ready. Click the top bird to trigger Jailbreak.
            </div>
        </div>

        <!-- RIGHT ELEMENT: Static Phoenix shifted right -->
        <div class="phoenix-container">
            <div class="phoenix-layer"></div>
        </div>

    </div>

    <!-- UI Floating Accents -->
    <div class="side-wrapper left-side">
        <img src="tri.png" class="ps-icon-side tri">
        <img src="squ.png" class="ps-icon-side squ">
    </div>
    <div class="side-wrapper right-side">
        <img src="cir.png" class="ps-icon-side cir">
        <img src="cro.png" class="ps-icon-side cro">
    </div>

    <img src="wri.png" class="writing-layer">

    <script>
        const outputConsole = document.getElementById("messages");
        
        window.log = function (msg, color) {
            if (color === undefined) color = "#00ffcc";
            outputConsole.innerHTML += "<div style='color:" + color + "'> > " + msg + "</div>";
            var box = document.querySelector(".console-internal-menu");
            box.scrollTop = box.scrollHeight;
        };

        window.addEventListener('error', function (event) {
            var reason = event.error;
            var msg = 'Unhandled error: ';
            if (reason) {
                msg += reason + (reason.stack ? '\n' + reason.stack : '');
            } else {
                msg += 'No error object detect.';
            }
            window.log(msg, "red");
            return true;
        });

        var jailbreakBtn = document.getElementById("jailbreak-btn");

        jailbreakBtn.addEventListener("click", function () {
            jailbreakBtn.disabled = true;
            outputConsole.innerHTML = ""; 
            window.log("Initializing PHOENIX Exploit Engine...", "#ffd700");
            
            try {
                doJailBreak();
            } catch (error) {
                window.log("An error occurred during exploit execution: " + error, "red");
                jailbreakBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
