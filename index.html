<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHOENIX HOST</title>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:url('bgs.jpg') center/cover no-repeat;
font-family:monospace;
color:#fff;
}

.main-layout{
display:flex;
width:100%;
height:100%;
}

.left-section{
flex:1;
display:flex;
align-items:center;
justify-content:center;
}

.frame-container{
width:90%;
height:85%;
background:url('images/frame.png') center/100% 100% no-repeat;
display:flex;
align-items:center;
justify-content:center;
position:relative;
overflow:hidden;
}

#console{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:80%;
height:75%;
background:rgba(0,0,0,0.6);
padding:10px;
box-sizing:border-box;
overflow:auto;
white-space:pre-wrap;
}

.right-section{
flex:1;
display:flex;
align-items:center;
justify-content:center;
}
</style>

<script src="./bundle.js" defer></script>
</head>

<body>

<div class="main-layout">

<div class="left-section">
<div class="frame-container">
<pre id="console">STATUS: Loading...</pre>
</div>
</div>

<div class="right-section">
<h1>PHOENIX HOST</h1>
</div>

</div>

</body>
</html>
