<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHOENIX HOST</title>

<style>

body{
    margin:0;
    padding:0;
    background:black;
    color:white;
    font-family:Arial;
    text-align:center;
}

.logo{
    margin-top:80px;
    font-size:55px;
    font-weight:bold;
    color:white;
    text-shadow:0 0 20px orange;
}

.version{
    font-size:28px;
    color:gray;
    margin-top:10px;
}

.loading{
    margin-top:60px;
    font-size:24px;
    color:#00aaff;
}

</style>
</head>

<body>

<div class="logo">PHOENIX HOST</div>

<div class="version">
AUTO DETECT SYSTEM
</div>

<div class="loading">
Detecting Firmware...
</div>

<script>

function detectFirmware() {

let ua = navigator.userAgent;

if (ua.includes("PlayStation 4")) {

if (ua.includes("9.00")) {
window.location.href = "G900/index.html";
}

else if (ua.includes("7.55")) {
window.location.href = "G755/index.html";
}

else if (ua.includes("6.72")) {
window.location.href = "G672/index.html";
}

else if (ua.includes("5.05")) {
window.location.href = "G505/index.html";
}

else {
document.querySelector(".loading").innerHTML =
"Firmware Not Supported";
}

}
else{
document.querySelector(".loading").innerHTML =
"Open From PS4 Browser";
}

}

setTimeout(detectFirmware, 2000);

</script>

</body>
</html>
