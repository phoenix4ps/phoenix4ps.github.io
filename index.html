<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHOENIX HOST</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background"></div>

<div class="overlay"></div>

<div class="container">

    <h1 class="title">PHOENIX HOST</h1>

    <div class="version">7.00 - 9.60</div>

    <div class="ps-logo">
        PS
    </div>

    <img src="wri.png" class="phoenix">

    <div class="ps-buttons">

        <img src="tri.png" class="btn tri">

        <img src="Squ.png" class="btn squ">

        <img src="cir.png" class="btn cir">

        <img src="cro.png" class="btn cro">

    </div>

    <div class="bottom-title">
        Phoenix Game
    </div>

    <div class="status" id="status">
        > Initializing PS4IDEA Core Execution...
    </div>

</div>

<script>

const statusText = document.getElementById("status");

const messages = [

"> Initializing PS4IDEA Core Execution...",

"> Loading Exploit Engine...",

"> Detecting Firmware...",

"> Firmware Supported!",

"> Loading GoldHEN Payload...",

"> Injecting Payload...",

"> Waiting For Console Response...",

"> GoldHEN Loaded Successfully!",

"> Welcome To Phoenix Host"

];

let i = 0;

function nextMessage() {

    statusText.innerHTML = messages[i];

    i++;

    if(i < messages.length){

        setTimeout(nextMessage, 2200);

    }

}

setTimeout(nextMessage, 2000);

</script>

<script src="psfree.js"></script>

<script src="bundle.js"></script>

</body>

</html>
