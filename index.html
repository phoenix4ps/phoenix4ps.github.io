<!DOCTYPE html>
<html lang="en" manifest="psfree_lapse.cache">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHOENIX GAME</title>
    
    <script src="psfree_lapse_shared.js"></script>
    <script src="psfree.js"></script>
    <script src="bundle.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }

        body {
            background-image: url('bg.jpg'); 
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 30px;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #ffffff;
            font-size: 32px;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 140, 0, 0.8);
            z-index: 10;
        }

        .subtitle {
            color: #aaaaaa;
            font-size: 16px;
            margin-bottom: 15px;
            letter-spacing: 2px;
            z-index: 10;
        }

        #jailbreak-btn {
            background-color: rgba(128, 128, 128, 0.15); 
            color: #888888;
            width: 80px; 
            height: 80px;
            border: 3px solid #888888; 
            border-radius: 50%; 
            font-size: 22px;   
            font-weight: bold;
            cursor: not-allowed;
            z-index: 10;
            box-shadow: none;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            opacity: 0.5;
        }

        #jailbreak-btn.active {
            background-color: rgba(0, 92, 248, 0.15); 
            color: #005cf8;
            border: 3px solid #005cf8; 
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 92, 248, 0.5);
            opacity: 1;
        }

        .phoenix-container {
            width: 380px; 
            height: 380px;
            z-index: 1;
            mix-blend-mode: screen; 
            animation: pulse-glow-only 2.5s infinite ease-in-out;
            margin-top: 15px;
        }

        .phoenix-layer {
            width: 100%;
            height: 100%;
            background-image: url('icon0.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        @keyframes pulse-glow-only {
            0% { filter: drop-shadow(0 0 15px rgba(255, 69, 0, 0.6)); }
            50% { filter: drop-shadow(0 0 45px rgba(255, 69, 0, 0.9)); }
            100% { filter: drop-shadow(0 0 15px rgba(255, 69, 0, 0.6)); }
        }

        .side-wrapper {
            position: fixed;
            top: 40%; 
            display: flex;
            gap: 40px;
            z-index: 10;
        }
        .left-side { left: 5%; }
        .right-side { right: 5%; }

        .ps-icon-side {
            width: 64px;
            height: 64px;
        }

        .tri { filter: drop-shadow(0 0 15px #4caf50); } 
        .squ { filter: drop-shadow(0 0 15px #e91e63); } 
        .cir { filter: drop-shadow(0 0 15px #ff5722); } 
        .cro { filter: drop-shadow(0 0 15px #2196f3); } 

        .writing-layer {
            margin-top: -10px; 
            width: 380px;
            height: auto;
            object-fit: contain;
            z-index: 10;
            filter: drop-shadow(0 0 15px #ffd700) drop-shadow(0 0 25px #ff8c00);
        }

        #console-box {
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            width: 96%;
            height: 140px;
            padding: 15px;
            font-family: monospace;
            font-size: 14px;
            color: #00ffcc;
            z-index: 10;
            border-radius: 12px;
            margin-top: 25px; 
            overflow-y: auto;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h1>PHOENIX HOST</h1>
    <div class="subtitle">7.00 - 9.60</div>

    <button id="jailbreak-btn" onclick="startExploit()">PS</button>

    <div class="phoenix-container">
        <div class="phoenix-layer"></div>
    </div>

    <div class="side-wrapper left-side">
        <img src="tri.png" class="ps-icon-side tri">
        <img src="squ.png" class="ps-icon-side squ">
    </div>
    <div class="side-wrapper right-side">
        <img src="cir.png" class="ps-icon-side cir">
        <img src="cro.png" class="ps-icon-side cro">
    </div>

    <img src="wri.png" class="writing-layer">

    <div id="console-box">
        <div id="messages">Checking system cache...</div>
    </div>

    <script>
        var isReadyToExploit = false;

        function printMsg(text) {
            var msgDiv = document.getElementById("messages");
            msgDiv.innerHTML += "<div class='log-entry'>> " + text + "</div>";
            var box = document.getElementById("console-box");
            box.scrollTop = box.scrollHeight;
        }

        function enableButton() {
            isReadyToExploit = true;
            var btn = document.getElementById("jailbreak-btn");
            btn.className = "active";
        }

        function startExploit() {
            if (!isReadyToExploit) {
                return;
            }
            document.getElementById("messages").innerHTML = ""; 
            printMsg("Starting PSFree Exploit..."); 
            
            try {
                setTimeout(function() {
                    Init_PSFreeGlobals(); 
                    printMsg("Triggering Lapse Kernel chain...");
                    
                    setTimeout(function() {
                        window.postMessage('js_run', '*');
                    }, 400);
                    
                }, 600);
            } catch(e) { 
                printMsg("Exploit failed, please reload page."); 
            }
        }

        if (window.applicationCache) {
            var cache = window.applicationCache;

            cache.addEventListener('checking', function() {
                document.getElementById("messages").innerHTML = "";
                printMsg("Checking for cache manifest...");
            });

            cache.addEventListener('downloading', function() {
                printMsg("Downloading file updates...");
            });

            cache.addEventListener('progress', function(e) {
                if (e.lengthComputable) {
                    var percent = Math.round((e.loaded / e.total) * 100);
                    document.getElementById("messages").innerHTML = "";
                    printMsg("Downloading: " + percent + "%");
                }
            });

            cache.addEventListener('cached', function() {
                printMsg("Cache completely saved offline!");
                printMsg("System Ready. Click PS button.");
                enableButton();
            });

            cache.addEventListener('noupdate', function() {
                printMsg("Cache is up to date.");
                printMsg("System Ready. Click PS button.");
                enableButton();
            });

            cache.addEventListener('error', function() {
                printMsg("Cache offline setup ready.");
                printMsg("System Ready. Click PS button.");
                enableButton();
            });
        } else {
            printMsg("AppCache not supported on this browser.");
            enableButton();
        }
    </script>
</body>
</html>
