<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHOENIX HOST - OPEN CONSOLE TEST</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c0f12;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 30px;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #ffffff;
            font-size: 28px;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 140, 0, 0.8);
        }

        .subtitle {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        #demo-btn {
            background-color: rgba(0, 92, 248, 0.15); 
            color: #005cf8;
            border: 3px solid #005cf8; 
            width: 80px; 
            height: 80px;
            border-radius: 50%; 
            font-size: 16px;   
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 92, 248, 0.5);
            outline: none;
            transition: all 0.3s ease;
        }

        #demo-btn:active {
            transform: scale(0.95);
            background-color: rgba(0, 92, 248, 0.4);
        }

        /* Open Console Wrapper - No Top Border */
        #console-container {
            position: relative;
            width: 90%;
            max-width: 400px;
            height: 150px;
            margin-top: 40px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.15);
            border-left: 2px solid rgba(255, 255, 255, 0.15);
            border-right: 2px solid rgba(255, 255, 255, 0.15);
            border-top: none; /* No border on top */
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 40%, rgba(0, 0, 0, 0) 100%);
            overflow: hidden;
        }

        /* Scroller forcing text to stay down and fade out at the 50% mark */
        #console-box {
            width: 100%;
            height: 100%;
            padding: 15px;
            font-family: monospace;
            font-size: 13px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
        }

        .log-entry {
            opacity: 0;
            animation: lineFadeIn 0.3s ease-out forwards;
            margin-top: 5px;
            line-height: 1.4;
        }

        @keyframes lineFadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>PHOENIX PREVIEW</h1>
    <div class="subtitle">Open Console Concept</div>

    <button id="demo-btn" onclick="startMobileDemo()">TEST</button>

    <div id="console-container">
        <div id="console-box">
            <div id="messages">
                <div class="log-entry" style="color: #888;">> Press TEST to simulate open console...</div>
            </div>
        </div>
    </div>

    <script>
        const outputConsole = document.getElementById("messages");
        let step = 0;
        let interval = null;

        const dummyLogs = [
            { text: "Initializing Webkit Core...", color: "#00ffcc" },
            { text: "Searching for vulnerable JSObjects...", color: "#00ffcc" },
            { text: "Garbage collection triggered...", color: "#ffd700" },
            { text: "WebKit Exploit: SUCCESS!", color: "#00ff88" },
            { text: "Triggering Lapse Kernel Exploit...", color: "#00ffcc" },
            { text: "Setting up Kchain context...", color: "#00ffcc" },
            { text: "Escalating privileges to Root...", color: "#ffd700" },
            { text: "Kernel Exploit: SUCCESS!", color: "#00ff88" },
            { text: "Locating payload.bin from server...", color: "#00ffcc" },
            { text: "Injecting GoldHEN payload...", color: "#ff8c00" },
            { text: "GoldHEN v2.4b14 Launched!", color: "#00ff88" },
            { text: "System fully unlocked. Enjoy!", color: "#ffffff" }
        ];

        function startMobileDemo() {
            document.getElementById("demo-btn").disabled = true;
            outputConsole.innerHTML = "";
            step = 0;

            interval = setInterval(() => {
                if (step < dummyLogs.length) {
                    const currentLog = dummyLogs[step];
                    outputConsole.innerHTML += "<div class='log-entry' style='color:" + currentLog.color + "'> > " + currentLog.text + "</div>";
                    step++;
                } else {
                    clearInterval(interval);
                    document.getElementById("demo-btn").disabled = false;
                }
            }, 1000); 
        }
    </script>
</body>
</html>
