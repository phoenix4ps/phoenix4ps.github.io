<!DOCTYPE html>
<html lang="en" manifest="psfree_lapse.cache">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>PHOENIX GAME</title>

    <!-- Stable PHOENIX Core -->
    <script src="bundle.js"></script>

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    background-image:url('bg.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;

    padding-top:30px;
    font-family:Arial,sans-serif;
}

/* ===================== */
/* TITLE */
/* ===================== */

h1{
    color:#fff;
    font-size:32px;
    margin:0;
    text-transform:uppercase;
    text-shadow: 0 0 15px rgba(255,140,0,.8);
    z-index:10;
}

.subtitle{
    color:#aaa;
    font-size:16px;
    margin-bottom:15px;
    letter-spacing:2px;
    z-index:10;
}

/* ===================== */
/* BUTTON */
/* ===================== */

#jailbreak-btn{
    background-color:rgba(0,92,248,.15);
    color:#005cf8;
    border:3px solid #005cf8;
    width:80px;
    height:80px;
    border-radius:50%;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    z-index:10;
    margin-bottom:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    outline:none;
    box-shadow: 0 0 20px rgba(0,92,248,.5);
    transition:.25s;
}

#jailbreak-btn:active{
    transform:scale(.95);
}

#jailbreak-btn:disabled{
    background-color:rgba(128,128,128,.15);
    color:#888;
    border:3px solid #888;
    opacity:.5;
    cursor:not-allowed;
    box-shadow:none;
}

/* ===================== */
/* PS4IDEA LOG FORMAT CONSOLE */
/* ===================== */

#console-box {
    width: 420px;
    background-color: #1e1e1e;
    color: #cccccc;
    border: 1px solid #3c3c3c;
    padding: 12px;
    border-radius: 6px;
    margin-top: 20px;
    text-align: left;
    overflow-y: auto;
    z-index: 10;
}

#messages {
    font-family: monospace;
    white-space: pre-wrap;
}

/* ===================== */
/* PHOENIX */
/* ===================== */

.phoenix-container{
    width:380px;
    height:380px;
    z-index:1;
}
</style>
</head>
<body>

    <h1>PHOENIX GAME</h1>
    <div class="subtitle">Select payload to deploy</div>

    <div>
        <button id="jailbreak-btn">GO</button>
    </div>

    <!-- PS4IDEA Default visible layout match -->
    <pre id="console-box"><div id="messages"></div></pre>

    <script>
        // Event definitions for unhandled rejections matching PS4IDEA standard
        addEventListener('unhandledrejection', event => {
          const reason = event.reason;
          alert(
            'Unhandled rejection\n'
            + `${reason}\n`
            + `${reason.sourceURL}:${reason.line}:${reason.column}\n`
            + `${reason.stack}`
          );
        });

        addEventListener('error', event => {
          const reason = event.error;
          alert(
            'Unhandled error\n'
            + `${reason}\n`
            + `${reason.sourceURL}:${reason.line}:${reason.column}\n`
            + `${reason.stack}`
          );
          return true;
        });

        document.getElementById("jailbreak-btn").addEventListener("click", function() {
            this.disabled = true;
            
            var msgDiv = document.getElementById("messages");
            if (msgDiv) {
                msgDiv.textContent = ""; 
            }

            try {
                if (typeof window.doJBwithPSFreeLapseExploit === "function") {
                    window.doJBwithPSFreeLapseExploit();
                } else if (typeof window.runExploit === "function") {
                    window.runExploit();
                }
            } catch (error) {
                if (msgDiv) {
                    msgDiv.innerHTML += "<span style='color:red'>An error occured during exploit: " + error + "</span><br>";
                }
                this.disabled = false;
            }
        });
    </script>
</body>
</html>
