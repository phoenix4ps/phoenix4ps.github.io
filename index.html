<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHOENIX HOST</title>

<style>
body{
margin:0;
padding:0;
background:url('bgs.jpg') center/cover no-repeat;
color:#fff;
font-family:monospace;
overflow:hidden;
}
#console{
position:fixed;
bottom:0;
left:0;
width:100%;
height:40%;
background:rgba(0,0,0,0.7);
overflow:auto;
padding:10px;
box-sizing:border-box;
}
</style>

<script src="./bundle.js" defer></script>
</head>

<body>

<div id="console">STATUS: Starting...</div>

<script>
const consoleBox=document.getElementById("console");

const assetsToLoad=[
"images/frame.png",
"images/click_bird.png",
"images/wris.png"
];

let loadedAssets=0;
let totalAssets=assetsToLoad.length+2;

function log(msg){
consoleBox.innerHTML+="\n> "+msg;
consoleBox.scrollTop=consoleBox.scrollHeight;
}

function updateProgress(){
let p=Math.round((loadedAssets/totalAssets)*100);
document.title="["+p+"%] PHOENIX HOST";
consoleBox.innerHTML=
"STATUS: Loading...\n> "+p+"%\n> "+loadedAssets+"/"+totalAssets;
}

function loadBackground(){
let bg=new Image();
bg.src="bgs.jpg";
bg.onload=function(){
loadedAssets++;
updateProgress();
loadPNGs();
};
}

function loadPNGs(){
assetsToLoad.forEach(src=>{
let img=new Image();
img.src=src;
img.onload=function(){
loadedAssets++;
updateProgress();
checkFinish();
};
img.onerror=function(){
loadedAssets++;
updateProgress();
checkFinish();
};
});
}

function detectSystem(){
setTimeout(function(){
log("System check complete");
loadedAssets++;
updateProgress();
loadRemaining();
},0);
}

function loadRemaining(){
let s=document.createElement("script");
s.src="./bundle.js";
s.onload=function(){
loadedAssets++;
updateProgress();
log("Bundle loaded");
};
document.body.appendChild(s);
}

function checkFinish(){
if(loadedAssets>=totalAssets){
log("ALL LOADED");
detectSystem();
}
}

updateProgress();
loadBackground();
</script>

</body>
</html>
