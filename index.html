<!DOCTYPE html>
<html lang="en" manifest="psfree_lapse.cache">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>PHOENIX GAME</title>

    <script src="bundle.js"></script>

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    background-image:url('bg.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;

    padding-top:25px;

    font-family:Arial,sans-serif;
    box-sizing: border-box;
}

h1{
    color:#fff;
    font-size:36px;
    margin:0;
    text-transform:uppercase;
    text-shadow: 0 0 15px rgba(255,140,0,.8);
    z-index:10;
}

.subtitle{
    color:#aaa;
    font-size:16px;
    margin-bottom:15px;
    letter-spacing:2px;
    z-index:10;
}

#jailbreak-btn{
    background-color:rgba(0,92,248,.15);
    color:#005cf8;
    border:3px solid #005cf8;
    width:85px;
    height:85px;
    border-radius:50%;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    z-index:10;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    outline:none;
    box-shadow: 0 0 20px rgba(0,92,248,.5);
    transition:.25s;
}

#jailbreak-btn:active{
    transform:scale(.95);
}

#jailbreak-btn:disabled{
    background-color:rgba(128,128,128,.15);
    color:#888;
    border:3px solid #888;
    opacity:.5;
    cursor:not-allowed;
    box-shadow:none;
}

.main-content-layout {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    width: 100%;
    z-index: 10;
    margin-top: 10px;
    max-width: 800px;
    gap: 70px;
}

.phoenix-container{
    width: 320px;
    height: 320px;
    z-index:1;
    mix-blend-mode:screen;
    animation:pulse-glow-only 2.5s infinite ease-in-out;
}

.phoenix-layer{
    width:100%;
    height:100%;
    background-image:url('icon0.png');
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;
}

@keyframes pulse-glow-only{
    0%{ filter: drop-shadow(0 0 15px rgba(255,69,0,.6)); }
    50%{ filter: drop-shadow(0 0 45px rgba(255,69,0,.9)); }
    100%{ filter: drop-shadow(0 0 15px rgba(255,69,0,.6)); }
}

.side-wrapper{
    display:flex;
    flex-direction: column;
    gap: 40px;
}

.ps-icon-side{
    width: 65px;
    height: 65px;
}

.tri{ filter:drop-shadow(0 0 15px #4caf50); }
.squ{ filter:drop-shadow(0 0 15px #e91e63); }
.cir{ filter:drop-shadow(0 0 15px #ff5722); }
.cro{ filter:drop-shadow(0 0 15px #2196f3); }

.writing-layer{
    margin-top: 15px;
    width: 360px;
    object-fit:contain;
    z-index:10;
    filter: drop-shadow(0 0 15px #ffd700) drop-shadow(0 0 25px #ff8c00);
}

#console-container{
    position:fixed;
    bottom:0px;
    left:2%;
    width:96%;
    height:140px;
    border:none;
    
    background: linear-gradient(
        to top,
        rgba(0,0,0,.60) 20%,
        rgba(0,0,0,.25) 60%,
        rgba(0,0,0,0) 100%
    );
    backdrop-filter:blur(4px);
    overflow:hidden;
    z-index:100;

    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
    mask-image: linear-gradient(to top, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);

    box-shadow: 0 -10px 30px rgba(0, 255, 204, 0.4), 0 -2px 12px rgba(0, 255, 204, 0.2);
}

#console-container::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 6%, rgba(0,0,0,0) 94%, rgba(0,0,0,1) 100%);
    mix-blend-mode:destination-out;
}

.scanlines{
    position:absolute;
    inset:0;
    pointer-events:none;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 2px, transparent 4px);
    opacity:.15;
}

#console-box{
    width:100%;
    height:100%;
    overflow-y:auto;
    padding:18px 30px;
    box-sizing:border-box;
    font-family:monospace;
    font-size:15px;
    color:#888;
}

.log-entry{
    opacity:0;
    animation:fadeIn .25s ease forwards;
    margin-top:4px;
    line-height:1.4;
    text-shadow: 0 0 6px currentColor;
}

@keyframes fadeIn{
    to{ opacity:1; }
}

@media (max-width: 600px) {
    body {
        overflow-y: auto;
        padding-bottom: 160px;
    }
    h1 { font-size: 26px; }
    .subtitle { font-size: 13px; }
    #jailbreak-btn { width: 70px; height: 70px; font-size: 18px; }
    
    .main-content-layout {
        max-width: 100%;
        gap: 15px;
    }
    .phoenix-container {
        width: 190px;
        height: 190px;
    }
    .side-wrapper { gap: 20px; }
    .ps-icon-side { width: 42px; height: 42px; }
    .writing-layer { width: 240px; }
    #console-container { height: 120px; }
    #console-box { font-size: 12px; padding: 12px 15px; }
}

</style>

<script>
if((window.applicationCache.status == '0') || (window.applicationCache.status == '3')){
    window.location.replace("cache.html");
}
</script>

</head>

<body>

<h1>PHOENIX HOST</h1>

<div class="subtitle">7.00 - 9.60</div>

<button id="jailbreak-btn">PS</button>

<div class="main-content-layout">
    <div class="side-wrapper">
        <img src="tri.png" class="ps-icon-side tri">
        <img src="squ.png" class="ps-icon-side squ">
    </div>

    <div class="phoenix-container">
        <div class="phoenix-layer"></div>
    </div>

    <div class="side-wrapper">
        <img src="cir.png" class="ps-icon-side cir">
        <img src="cro.png" class="ps-icon-side cro">
    </div>
</div>

<img src="wri.png" class="writing-layer">

<div id="console-container">
    <div class="scanlines"></div>
    <div id="console-box">
        <div id="messages">
            <div class="log-entry" style="color:#888;">
                > System Ready. Click PS button to execute GoldHEN ecosystem.
            </div>
        </div>
    </div>
</div>

<script>
const outputConsole = document.getElementById("messages");

window.log = (msg, color="#00ffcc")=>{
    outputConsole.innerHTML += "<div class='log-entry' style='color:" + color + "'> > " + msg + "</div>";
    const box = document.getElementById("console-box");
    box.scrollTop = box.scrollHeight;
};

addEventListener('unhandledrejection', event=>{
    window.log("Rejection: " + event.reason, "red");
});

addEventListener('error', event=>{
    window.log("Error: " + event.error, "red");
    return true;
});

window.loadAutoPayload = function() {
    window.log("WebKit Success! Fetching payload.bin from repository...", "#ffd700");
    
    fetch("payload.bin")
        .then(response => response.arrayBuffer())
        .then(buffer => {
            window.log("SUCCESS: GoldHEN Ecosystem Active!", "#00ffcc");
            window.log("All Features Injected: Cheats, FTP, and Server Blockers running.", "#00ffcc");
        })
        .catch(err => {
            window.log("Error: payload.bin could not be fetched automatically.", "red");
        });
};

document.getElementById("jailbreak-btn").addEventListener("click", ()=>{
    document.getElementById("jailbreak-btn").disabled = true;
    outputConsole.innerHTML = "";

    window.log("Initializing PHOENIX Core Execution...", "#00ffcc");

    try{
        setTimeout(()=>{
            doJBwithPSFreeLapseExploit();
        },300);
    }catch(error){
        window.log("Exploit Interrupted: " + error, "red");
        document.getElementById("jailbreak-btn").disabled = false;
    }
});
</script>

</body>
</html>
