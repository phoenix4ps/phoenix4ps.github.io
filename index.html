<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHOENIX HOST</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background"></div>

<div class="overlay"></div>

<div class="container">

    <h1 class="title">PHOENIX HOST</h1>

    <div class="version">7.00 - 9.60</div>

    <div class="ps-logo">
        PS
    </div>

    <img src="wri.png" class="phoenix">

    <div class="ps-buttons">

        <img src="tri.png" class="btn tri">

        <img src="Squ.png" class="btn squ">

        <img src="cir.png" class="btn cir">

        <img src="cro.png" class="btn cro">

    </div>

    <div class="bottom-title">
        Phoenix Host
    </div>

    <div class="loader-container">

        <div class="loader-bar-bg">

            <div class="loader-bar" id="loader-bar"></div>

        </div>

        <div class="loader-text" id="loader-text">

            Initializing Phoenix Core...

        </div>

    </div>

    <div class="status" id="status">

        > Initializing Phoenix Core Execution...

    </div>

    <div class="payload-menu" id="payload-menu">

        <button onclick="loadPayload('GoldHEN')">
            GoldHEN
        </button>

        <button onclick="loadPayload('Bin Loader')">
            Bin Loader
        </button>

        <button onclick="loadPayload('FTP')">
            FTP
        </button>

        <button onclick="loadPayload('App2USB')">
            App2USB
        </button>

    </div>

</div>

<script src="psfree.js"></script>

<script src="bundle.js"></script>

</body>

</html>
