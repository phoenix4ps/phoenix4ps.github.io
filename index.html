<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no" manifest="psfree_lapse.cache">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHOENIX GAME</title>
    <script src="./bundle.js"></script>
    <style>
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000 !important; 
        }
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-image: url('bg.jpg') !important;
            background-size: cover !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            height: 100vh;
            opacity: 1; 
            transition: opacity 0.5s ease-in-out;
        }
        .main-layout {
            display: flex;
            width: 100%;
            height: 100vh;
            box-sizing: border-box;
            background: transparent !important;
            position: relative;
        }
        .left-section {
            flex: 38.2;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            background: transparent !important;
        }
        .frame-container {
            width: 100%;
            height: 85%;
            background-color: rgba(0, 0, 0, 0.4) !important;
            background-image: url('frame.png'); 
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 55px;
            box-sizing: border-box;
            position: relative;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        .frame-container::before {
            content: '';
            position: absolute;
            top: 2%;
            left: 2%;
            right: 2%;
            bottom: 2%;
            border: 4px solid transparent;
            border-image: linear-gradient(135deg, #00d2ff 0%, #00d2ff 15%, transparent 15%, transparent 85%, #00ffcc 85%, #00ffcc 100%) 1;
            pointer-events: none;
            animation: neonPulse 3s infinite ease-in-out;
        }
        .frame-container::after {
            content: '';
            position: absolute;
            top: 2%;
            left: 2%;
            right: 2%;
            bottom: 2%;
            border: 4px solid transparent;
            border-image: linear-gradient(225deg, #00ffcc 0%, #00ffcc 15%, transparent 15%, transparent 85%, #00d2ff 85%, #00d2ff 100%) 1;
            pointer-events: none;
            animation: neonPulse 3s infinite ease-in-out reverse;
        }
        #info-box {
            width: 76%;
            background: transparent !important;
            border: none !important;
            padding: 5px 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            font-weight: bold;
            color: #00d2ff;
            text-align: center;
            box-sizing: border-box;
            z-index: 2;
            margin: 0 0 10px 0;
            box-shadow: none !important;
        }
        #messages {
            width: 76%;  
            height: 64%; 
            background: rgba(0, 0, 0, 0.65) !important; 
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem; 
            color: #00ffcc; 
            text-align: left;
            overflow-y: auto; 
            box-sizing: border-box;
            line-height: 1.4;
            z-index: 2;
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 2px solid #ffffff;
            animation: whiteGlowPulse 3s infinite ease-in-out;
        }
        #messages::-webkit-scrollbar {
            width: 5px;
        }
        #messages::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 204, 0.3);
            border-radius: 4px;
        }
        .right-section {
            flex: 61.8;
            height: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 10px 30px 20px 30px;
            box-sizing: border-box;
            background: transparent !important;
        }
        .main-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 98%;
            background: transparent !important;
        }
        .top-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-top: 40px;
            padding-top: 5px;
        }
        .header-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .main-title-text {
            font-size: 1.6rem; 
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 4px;
            margin: 0 0 2px 0;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
        }
        .subtitle {
            font-size: 0.95rem; 
            color: #00d2ff;
            letter-spacing: 2px;
            margin: 0;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 210, 255, 0.5);
            font-family: monospace;
        }
        .action-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        #jailbreak-btn {
            width: 77px; 
            height: 77px; 
            background-image: url('click_bird.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            border-radius: 50%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
            opacity: 1;
        }
        #jailbreak-btn:hover, #jailbreak-btn:focus {
            transform: scale(1.05) translate3d(0,0,0);
            box-shadow: 0 0 20px #00d2ff, inset 0 0 10px #00ffcc;
            outline: none;
        }
        #jailbreak-btn:disabled {
            cursor: not-allowed;
            opacity: 0.3;
        }
        .logo-container {
            text-align: center;
            margin-top: auto;
            margin-bottom: 5px;
        }
        .main-title-img {
            max-width: 60%; 
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .side-wrapper {
            position: fixed;
            top: 45%; 
            display: flex;
            gap: 25px;
            z-index: 2;
            opacity: 0.6;
        }
        .left-side { left: 2%; }
        .right-side { right: 2%; }
        .ps-icon-side { width: 48px; height: 48px; }
        .tri { filter: drop-shadow(0 0 10px #4caf50); } 
        .squ { filter: drop-shadow(0 0 10px #e91e63); } 
        .cir { filter: drop-shadow(0 0 10px #ff5722); } 
        .cro { filter: drop-shadow(0 0 10px #2196f3); } 
        @keyframes neonPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        @keyframes whiteGlowPulse {
            0%, 100% { box-shadow: 0 0 5px #ffffff, inset 0 0 2px rgba(255, 255, 255, 0.2); }
            50% { box-shadow: 0 0 18px #ffffff, inset 0 0 8px rgba(255, 255, 255, 0.4); }
        }
    </style>
    <script>
        if (window.applicationCache && window.applicationCache.status === 0) { 
            window.location.replace("cache.html");
        }
    </script>
</head>
<body class="notranslate">
    <div class="main-layout">
        <div class="left-section">
            <div class="frame-container">
                <div id="info-box">SYSTEM: Detecting environment...</div>
                <div id="messages">System Ready. Click the top bird to trigger Jailbreak.</div>
            </div>
        </div>
        <div class="right-section">
            <div class="main-controls">
                <div class="top-group">
                    <div class="header-container">
                        <h1 class="main-title-text">PHOENIX HOST</h1>
                        <div class="subtitle" id="hostSubtitle">7.00 - 9.60</div>
                    </div>
                    <div class="action-container">
                        <button id="jailbreak-btn" title="Click this Bird to Exploit"></button>
                    </div>
                </div>
                <div class="logo-container">
                    <img src="icon0.png" alt="PHOENIX" class="main-title-img">
                </div>
            </div>
        </div>
    </div>
    <div class="side-wrapper left-side">
        <img src="tri.png" class="ps-icon-side tri" alt="triangle">
        <img src="squ.png" class="ps-icon-side squ" alt="square">
    </div>
    <div class="side-wrapper right-side">
        <img src="cir.png" class="ps-icon-side cir" alt="circle">
        <img src="cro.png" class="ps-icon-side cro" alt="cross">
    </div>
</body>
</html>
