<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no" manifest="psfree_lapse.cache">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHOENIX GAME</title>
    <script src="./bundle.js"></script>
    <style>
        html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000 !important; }
        body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: url('bgs.jpg') no-repeat center center/cover fixed !important; font-family: 'Segoe UI', sans-serif; color: #fff; height: 100vh; }
        .main-layout { display: flex; width: 100%; height: 100vh; position: relative; }
        .left-section { flex: 38.2; height: 100%; display: flex; align-items: center; justify-content: center; padding: 10px; box-sizing: border-box; }
        
        .frame-container { 
            width: 100%; 
            height: 96%; 
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), url('images/frame.png') no-repeat center center/100% 100% !important; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            padding: 85px 30px 45px 30px; 
            box-sizing: border-box; 
            position: relative; 
            border-radius: 16px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.8); 
        }
        
        .frame-container::before, .frame-container::after { content: ''; position: absolute; top: 1%; left: 1%; right: 1%; bottom: 1%; border: 4px solid transparent; pointer-events: none; animation: neonPulse 3s infinite ease-in-out; border-radius: 12px; }
        .frame-container::before { border-image: linear-gradient(135deg, #00d2ff 0%, #00d2ff 15%, transparent 15%, transparent 85%, #00ffcc 85%, #00ffcc 100%) 1; }
        .frame-container::after { border-image: linear-gradient(225deg, #00ffcc 0%, #00ffcc 15%, transparent 15%, transparent 85%, #00d2ff 85%, #00d2ff 100%) 1; animation-direction: reverse; }
        
        #info-box { width: 90%; background: transparent; border: none; padding: 5px 10px; font-family: monospace; font-size: 0.85rem; font-weight: bold; color: #00d2ff; text-align: center; box-sizing: border-box; z-index: 2; margin-bottom: 25px; }
        
        #console { 
            width: 100%; 
            height: 70%; 
            background: transparent !important; 
            border-radius: 8px; 
            padding: 15px; 
            font-family: monospace; 
            font-size: 0.95rem; 
            color: #00ffcc; 
            text-align: left; 
            overflow-y: auto; 
            box-sizing: border-box; 
            line-height: 1.5; 
            z-index: 2; 
            white-space: pre-wrap; 
            word-wrap: break-word; 
            border: none !important; 
            animation: none !important; 
        }
        
        .right-section { flex: 61.8; height: 100%; display: flex; align-items: flex-start; justify-content: center; padding: 10px 30px 20px; box-sizing: border-box; }
        .main-controls { display: flex; flex-direction: column; align-items: center; justify-content: space-between; width: 100%; height: 98%; }
        .top-group { display: flex; flex-direction: column; align-items: center; width: 100%; margin-top: 40px; }
        .header-container { text-align: center; margin-bottom: 20px; }
        .main-title-text { font-size: 1.6rem; font-weight: 900; color: #fff; letter-spacing: 4px; margin: 0; text-shadow: 0 0 10px #00d2ff; }
        .subtitle { font-size: 0.95rem; color: #00d2ff; letter-spacing: 2px; margin: 0; font-weight: bold; text-shadow: 0 0 5px #00d2ff; font-family: monospace; }
        .action-container { width: 100%; display: flex; justify-content: center; }
        .btn-bird-trigger { width: 77px; height: 77px; object-fit: contain; cursor: pointer; border-radius: 50%; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 0 12px rgba(0,255,204,0.4); }
        .btn-bird-trigger:hover, .btn-bird-trigger:focus { transform: scale(1.05); box-shadow: 0 0 20px #00d2ff, inset 0 0 10px #00ffcc; outline: none; }
        .logo-container { text-align: center; margin-bottom: 5px; }
        .main-title-img { max-width: 60%; height: auto; display: block; margin: 0 auto; }
        @keyframes neonPulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
    <script>
        if (window.applicationCache && (window.applicationCache.status == '0' || window.applicationCache.status == '3')) {
            window.location.replace("cache.html");
        }
    </script>
</head>
<body>
    <div class="main-layout">
        <div class="left-section">
            <div class="frame-container">
                <div id="info-box">PHOENIX GAME HOST</div>
                <pre id="console">START THE GAME PLAYER</pre>
            </div>
        </div>
        <div class="right-section">
            <div class="main-controls">
                <div class="top-group">
                    <div class="header-container">
                        <h1 class="main-title-text">PHOENIX HOST</h1>
                        <div class="subtitle">7.00 - 9.60</div>
                    </div>
                    <div class="action-container">
                        <img id="clickBirdBtn" alt="CLICK BIRD" class="btn-bird-trigger" tabindex="0">
                    </div>
                </div>
                <div class="logo-container"><img id="wris" alt="wris" class="main-title-img"></div>
            </div>
        </div>
    </div>
    <script>
        const outputConsole = document.getElementById("console");
        const birdBtn = document.getElementById("clickBirdBtn");

        window.log = (msg, color="#00ffcc") => { 
            outputConsole.innerHTML += `<div style="color:${color}">> ${msg}</div>`; 
            outputConsole.scrollTop = outputConsole.scrollHeight;
        };

        addEventListener('unhandledrejection', event => {
            const reason = event.reason;
            alert('Unhandled rejection\n' + `${reason}\n` + `${reason.sourceURL}:${reason.line}:${reason.column}\n` + `${reason.stack}`);
        });

        addEventListener('error', event => {
            const reason = event.error;
            alert('Unhandled error\n' + `${reason}\n` + `${reason.sourceURL}:${reason.line}:${reason.column}\n` + `${reason.stack}`);
            return true;
        });

        window.onload = function() {
            document.getElementById('clickBirdBtn').src = 'images/click_bird.png';
            document.getElementById('wris').src = 'images/wris.png';
        };

        birdBtn.addEventListener("click", () => {
            birdBtn.style.pointerEvents = "none"; 
            birdBtn.style.opacity = "0.3";
            outputConsole.textContent = ""; 
            
            try {
                doJBwithPSFreeLapseExploit();
            } catch (error) {
                window.log("An error occured during exploit: " + error, "red");
            }
        });
    </script>
</body>
</html>
