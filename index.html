<!DOCTYPE html>
<html lang="en" manifest="psfree_lapse.cache">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>PHOENIX GAME</title>

    <!-- Stable PHOENIX Core -->
    <script src="bundle.js"></script>

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    background-image:url('bg.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;

    padding-top:30px;

    font-family:Arial,sans-serif;
}

/* ===================== */
/* TITLE */
/* ===================== */

h1{
    color:#fff;
    font-size:32px;
    margin:0;
    text-transform:uppercase;
    text-shadow: 0 0 15px rgba(255,140,0,.8);
    z-index:10;
}

.subtitle{
    color:#aaa;
    font-size:16px;
    margin-bottom:15px;
    letter-spacing:2px;
    z-index:10;
}

/* ===================== */
/* BUTTON */
/* ===================== */

#jailbreak-btn{
    background-color:rgba(0,92,248,.15);
    color:#005cf8;
    border:3px solid #005cf8;
    width:80px;
    height:80px;
    border-radius:50%;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    z-index:10;
    margin-bottom:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    outline:none;
    box-shadow: 0 0 20px rgba(0,92,248,.5);
    transition:.25s;
}

#jailbreak-btn:active{
    transform:scale(.95);
}

#jailbreak-btn:disabled{
    background-color:rgba(128,128,128,.15);
    color:#888;
    border:3px solid #888;
    opacity:.5;
    cursor:not-allowed;
    box-shadow:none;
}

/* ======================================= */
/* STATUS INFO & UTILITY BUTTONS STYLE     */
/* ======================================= */
.payload-container {
    display: flex;
    gap: 12px;
    margin-bottom: 5px;
    z-index: 10;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 80%;
}

.btn-payload {
    background-color: rgba(0, 0, 0, 0.4);
    color: #ffffff;
    border: 2px solid #ff8c00;
    padding: 10px 20px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 5px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 0 10px rgba(255, 140, 0, 0.2);
    transition: all 0.3s ease;
}

/* Special color for the active clock synchronization button */
.btn-clock-payload {
    border-color: #00ffcc;
    box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
}

.btn-payload:hover {
    background-color: #ff8c00;
    color: #000000;
    box-shadow: 0 0 15px rgba(255, 140, 0, 0.6);
}

.btn-clock-payload:hover {
    background-color: #00ffcc;
    color: #000000;
    box-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
}

.btn-payload:active {
    transform: scale(0.97);
}

/* ===================== */
/* PHOENIX */
/* ===================== */

.phoenix-container{
    width:380px;
    height:380px;
    z-index:1;
    mix-blend-mode:screen;
    animation:pulse-glow-only 2.5s infinite ease-in-out;
    margin-top:15px;
}

.phoenix-layer{
    width:100%;
    height:100%;
    background-image:url('icon0.png');
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;
}

@keyframes pulse-glow-only{
    0%{ filter: drop-shadow(0 0 15px rgba(255,69,0,.6)); }
    50%{ filter: drop-shadow(0 0 45px rgba(255,69,0,.9)); }
    100%{ filter: drop-shadow(0 0 15px rgba(255,69,0,.6)); }
}

/* ===================== */
/* SIDE ICONS */
/* ===================== */

.side-wrapper{
    position:fixed;
    top:40%;
    display:flex;
    flex-direction:column;
    gap:40px;
    z-index:10;
}

.left-side{ left:5%; }
.right-side{ right:5%; }

.ps-icon-side{
    width:64px;
    height:64px;
}

.tri{ filter:drop-shadow(0 0 15px #4caf50); }
.squ{ filter:drop-shadow(0 0 15px #e91e63); }
.cir{ filter:drop-shadow(0 0 15px #ff5722); }
.cro{ filter:drop-shadow(0 0 15px #2196f3); }

/* ===================== */
/* WRITING IMAGE */
/* ===================== */

.writing-layer{
    margin-top:-10px;
    width:380px;
    object-fit:contain;
    z-index:10;
    filter: drop-shadow(0 0 15px #ffd700) drop-shadow(0 0 25px #ff8c00);
}

/* ========================================================== */
/* FLOATING CONSOLE - HIGH TRANSPARENCY TO SHOW WALLPAPER     */
/* ========================================================== */

#console-container{
    position:relative;
    width:96%;
    height:145px;
    margin-top:25px;
    border:none;
    border-bottom-left-radius:14px;
    border-bottom-right-radius:14px;
    
    background: linear-gradient(
        to top,
        rgba(0,0,0,.35) 20%,
        rgba(0,0,0,.15) 55%,
        rgba(0,0,0,0) 100%
    );
    backdrop-filter:blur(5px);
    overflow:hidden;
    z-index:10;

    /* FULL FADE */
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 100%);
    mask-image: linear-gradient(to top, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 100%);

    /* SOFT LOWER GLOW */
    box-shadow: 0 20px 40px rgba(0,0,0,.35), 0 0 25px rgba(255,255,255,.03);
}

/* SIDE FADE */
#console-container::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 10%, rgba(0,0,0,0) 90%, rgba(0,0,0,1) 100%);
    mix-blend-mode:destination-out;
}

/* ===================== */
/* SCANLINES */
/* ===================== */

.scanlines{
    position:absolute;
    inset:0;
    pointer-events:none;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 2px, transparent 4px);
    opacity:.20;
}

/* ===================== */
/* CONSOLE TEXT */
/* ===================== */

#console-box{
    width:100%;
    height:100%;
    overflow-y:auto;
    padding:15px;
    box-sizing:border-box;
    font-family:monospace;
    font-size:14px;
    color:#00ffcc;
}

.log-entry{
    opacity:0;
    animation:fadeIn .25s ease forwards;
    margin-top:4px;
    line-height:1.4;
    text-shadow: 0 0 6px currentColor;
}

@keyframes fadeIn{
    to{ opacity:1; }
}

</style>

<script>
if((window.applicationCache.status == '0') || (window.applicationCache.status == '3')){
    window.location.replace("cache.html");
}
</script>

</head>

<body>

<h1>PHOENIX HOST</h1>

<div class="subtitle">7.00 - 9.60</div>

<!-- Single Action Button to trigger exploit -->
<button id="jailbreak-btn">PS</button>

<!-- Guide Info & Utility Buttons Component -->
<div class="payload-container">

    <button onclick="checkFTPStatus()" class="btn-payload">FTP Status Port 2121</button>

<div class="phoenix-container">

</div>

<div class="side-wrapper left-side">

</div>

<div class="side-wrapper right-side">

<!-- FLOATING TERMINAL -->

</div>

<script>

    const box = document.getElementById("console-box");
    box.scrollTop = box.scrollHeight;
};

/* ERROR HANDLING */

});

        })
        .catch(err => {
            window.log("Error: payload.bin could not be fetched automatically.", "red");
        });
};

        })
        .catch(err => {
            // Informing user to sync manually inside settings if payload file isn't uploaded yet
            window.log("Notice: Please sync via PS4 settings or upload time_sync.bin.", "#ff5722");
        });
}

/* INFORMATIONAL STATUS CHECKS FOR PLAYERS */
function checkUpdatesStatus() {
    window.log("System Status: Sony update servers are auto-blocked by GoldHEN payload.", "#ffd700");
}
