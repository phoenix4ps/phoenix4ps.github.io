<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Phoenix Host</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="overlay"></div>

<div class="container">

<h1 class="title">
PHOENIX HOST
</h1>

<div class="version">
7.00 - 9.60
</div>

<div class="ps-button" id="psButton">
PS
</div>

<div class="symbols">

<img src="assets/tri.png"
class="symbol tri">

<img src="assets/squ.png"
class="symbol squ">

<img src="assets/cir.png"
class="symbol cir">

<img src="assets/cro.png"
class="symbol cro">

</div>

<div class="loader-box">

<div class="loader-bar">

<div class="loader-progress"
id="loaderProgress"></div>

</div>

<div class="loader-text"
id="loaderText">

Initializing Phoenix Core...

</div>

</div>

<div class="payload-menu"
id="payloadMenu">

<button class="payload-btn"
onclick="loadGoldHEN()">

GoldHEN

</button>

<button class="payload-btn">

Bin Loader

</button>

<button class="payload-btn">

FTP

</button>

<button class="payload-btn">

App2USB

</button>

</div>

<div class="status"
id="statusText">

> Waiting For Initialization...

</div>

</div>

<script src="900/int64.js"></script>

<script src="900/rop.js"></script>

<script src="900/kexploit.js"></script>

<script src="900/exploit.js"></script>

<script src="bundle.js"></script>

</body>
</html>
