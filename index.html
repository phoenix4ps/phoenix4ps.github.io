<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>PHOENIX BLENDED PREVIEW</title>

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07090c;
}

body{
    background:
    radial-gradient(circle at center,
    #18202b 0%,
    #0b0f14 45%,
    #050608 100%);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;

    font-family:Arial,sans-serif;
    padding-top:30px;
}

/* ===================== */
/* TITLE */
/* ===================== */

h1{
    color:#fff;
    margin:0;
    font-size:34px;
    letter-spacing:2px;

    text-shadow:
    0 0 10px rgba(255,140,0,.6),
    0 0 30px rgba(255,140,0,.3);
}

.subtitle{
    color:#8e8e8e;
    margin-top:8px;
    margin-bottom:25px;
    letter-spacing:3px;
    font-size:14px;
}

/* ===================== */
/* BUTTON */
/* ===================== */

#demo-btn{
    width:85px;
    height:85px;
    border-radius:50%;

    border:3px solid #0077ff;

    background:
    radial-gradient(circle at top,
    rgba(0,140,255,.25),
    rgba(0,92,248,.08));

    color:#4da6ff;
    font-size:20px;
    font-weight:bold;

    cursor:pointer;
    outline:none;

    box-shadow:
    0 0 15px rgba(0,92,248,.4),
    inset 0 0 15px rgba(0,92,248,.15);

    transition:.25s;
}

#demo-btn:active{
    transform:scale(.95);
}

/* ===================== */
/* PHOENIX GLOW */
/* ===================== */

.phoenix{
    width:300px;
    height:300px;

    margin-top:20px;
    border-radius:50%;

    background:
    radial-gradient(circle,
    rgba(255,120,0,.8) 0%,
    rgba(255,80,0,.35) 35%,
    rgba(255,0,0,.08) 60%,
    transparent 75%);

    filter:blur(10px);

    animation:pulse 3s ease-in-out infinite;
}

@keyframes pulse{

    0%{
        transform:scale(.95);
        opacity:.7;
    }

    50%{
        transform:scale(1.05);
        opacity:1;
    }

    100%{
        transform:scale(.95);
        opacity:.7;
    }
}

/* ===================== */
/* BLENDED CONSOLE */
/* ===================== */

#console-container{

    position:relative;

    width:92%;
    max-width:520px;
    height:160px;

    margin-top:-20px;

    border-left:2px solid rgba(255,255,255,.10);
    border-right:2px solid rgba(255,255,255,.10);
    border-bottom:2px solid rgba(255,255,255,.10);

    border-bottom-left-radius:14px;
    border-bottom-right-radius:14px;

    background:
    linear-gradient(
    to top,
    rgba(0,0,0,.90) 20%,
    rgba(0,0,0,.45) 50%,
    rgba(0,0,0,0) 100%
    );

    backdrop-filter:blur(4px);

    overflow:hidden;

    /* TOP FADE */
    mask-image:
    linear-gradient(
    to top,
    rgba(0,0,0,1) 45%,
    rgba(0,0,0,0) 100%
    );

    -webkit-mask-image:
    linear-gradient(
    to top,
    rgba(0,0,0,1) 45%,
    rgba(0,0,0,0) 100%
    );
}

/* SIDE FADE OVERLAY */

#console-container::before{

    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    background:
    linear-gradient(
    to right,

    rgba(0,0,0,1) 0%,
    rgba(0,0,0,0) 10%,

    rgba(0,0,0,0) 90%,
    rgba(0,0,0,1) 100%
    );

    mix-blend-mode:destination-out;
}

/* ===================== */
/* CONSOLE TEXT */
/* ===================== */

#console-box{
    width:100%;
    height:100%;

    overflow-y:auto;

    box-sizing:border-box;
    padding:16px;

    font-family:monospace;
    font-size:14px;
}

.log-entry{

    opacity:0;

    animation:fadeIn .25s ease forwards;

    margin-top:5px;

    line-height:1.4;
}

@keyframes fadeIn{
    to{
        opacity:1;
    }
}

/* ===================== */
/* SCANLINE EFFECT */
/* ===================== */

.scanlines{

    position:absolute;
    inset:0;

    pointer-events:none;

    background:
    repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,.02) 0px,
    rgba(255,255,255,.02) 1px,
    transparent 2px,
    transparent 4px
    );

    opacity:.25;
}

</style>
</head>

<body>

<h1>PHOENIX HOST</h1>
<div class="subtitle">BLENDED CONSOLE PREVIEW</div>

<button id="demo-btn" onclick="startDemo()">PS</button>

<div class="phoenix"></div>

<div id="console-container">

    <div class="scanlines"></div>

    <div id="console-box">

        <div id="messages">

            <div class="log-entry" style="color:#777;">
                > Ready for initialization...
            </div>

        </div>

    </div>

</div>

<script>

const outputConsole =
document.getElementById("messages");

const logs = [

    {
        text:"Initializing WebKit core...",
        color:"#00ffcc"
    },

    {
        text:"Searching for corrupted JSObjects...",
        color:"#00ffcc"
    },

    {
        text:"Garbage Collector triggered...",
        color:"#ffd700"
    },

    {
        text:"WebKit exploit succeeded.",
        color:"#00ff88"
    },

    {
        text:"Launching Lapse Kernel...",
        color:"#00ffcc"
    },

    {
        text:"Escalating privileges...",
        color:"#ffae00"
    },

    {
        text:"Kernel access granted.",
        color:"#00ff88"
    },

    {
        text:"Injecting GoldHEN payload...",
        color:"#ff7b00"
    },

    {
        text:"GoldHEN loaded successfully.",
        color:"#00ff88"
    },

    {
        text:"System fully unlocked.",
        color:"#ffffff"
    }
];

function addLog(text,color){

    outputConsole.innerHTML +=
    "<div class='log-entry' style='color:"+color+"'> > "+text+"</div>";

    const box =
    document.getElementById("console-box");

    box.scrollTop =
    box.scrollHeight;
}

function startDemo(){

    outputConsole.innerHTML = "";

    let i = 0;

    const interval = setInterval(()=>{

        if(i >= logs.length){

            clearInterval(interval);
            return;
        }

        addLog(
        logs[i].text,
        logs[i].color
        );

        i++;

    },900);
}

</script>

</body>
</html>
