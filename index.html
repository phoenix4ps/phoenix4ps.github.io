<!DOCTYPE html>
<html lang="en" manifest="psfree_lapse.cache">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHOENIX GAME</title>
    <script src="./bundle.js"></script>
    <link rel="stylesheet" href="./style.css">
    <script>
    if((window.applicationCache.status == '0') || (window.applicationCache.status == '3')){
        window.location.replace("cache.html");
    }
    </script>
</head>
<body>

<h1>PHOENIX HOST</h1>
<div class="subtitle">7.00 - 9.60</div>

<button id="jailbreak-btn">Start Exploit</button>

<div class="main-content-layout">
    <div class="left-golden-column">
        <div id="console-container">
            <div class="scanlines"></div>
            <div id="console-box">
                <div id="messages">
                    <div class="log-entry">> System Initialized. Click the top Arc button to deploy GoldHEN.</div>
                </div>
            </div>
        </div>
        <div class="bottom-left-shortcut-zone">
            <button class="clock-fix-btn" id="clock-btn">Sync PS4 Clock (Fix 1970)</button>
        </div>
    </div>
    <div class="controller-neon-zone">
        <div class="phoenix-container">
            <img src="./lightning.png" class="lightning-background" alt="">
            <div class="controller-frame">
                <div class="inner-phoenix-logo"></div>
            </div>
        </div>
        <div class="neon-game-title-container">
            <div class="neon-line-pink">Phoenix</div>
            <div class="neon-waves-divider">~~~~~~</div>
            <div class="neon-line-blue">Game</div>
        </div>
    </div>
</div>

<script>
const outputConsole = document.getElementById("messages");

window.log = (msg, color="#00ffff")=>{
    outputConsole.innerHTML += "<div class='log-entry' style='color:" + color + "; text-shadow: 0 0 5px " + color + "'> > " + msg + "</div>";
    const box = document.getElementById("console-box");
    box.scrollTop = box.scrollHeight;
};

addEventListener('unhandledrejection', event=>{
    handleRuntimeError(event.reason);
});

addEventListener('error', event=>{
    handleRuntimeError(event.error);
    return true;
});

function handleRuntimeError(err) {
    let errStr = String(err);
    window.log("Exploit Interrupted: " + errStr, "#ff0055");
    if (errStr.includes("hardware") || errStr.includes("handshake") || errStr.includes("lost")) {
        window.log("Mismatched Runtime! Please click the yellow Sync Clock button below.", "#ffbb00");
    }
    document.getElementById("jailbreak-btn").disabled = false;
}

window.loadAutoPayload = function() {
    window.log("WebKit Exploit Injected! Loading GoldHEN ecosystem...", "#ffd700");
    fetch("./payload.bin")
        .then(response => response.arrayBuffer())
        .then(buffer => {
            window.log("SUCCESS: GoldHEN Core Active!", "#00ff66");
            window.log("CMOS Time Blocked. System ready for offline play.", "#00ff66");
        })
        .catch(err => {
            window.log("Payload Error: Verify payload.bin path.", "#ff0055");
        });
};

document.getElementById("jailbreak-btn").addEventListener("click", ()=>{
    document.getElementById("jailbreak-btn").disabled = true;
    outputConsole.innerHTML = "";
    window.log("Launching PHOENIX Core Kernel Exploitation...", "#00ffff");
    
    setTimeout(()=>{
        try {
            if (typeof doJBwithPSFreeLapseExploit === "function") {
                doJBwithPSFreeLapseExploit();
            } else {
                throw new Error("Exploit runtime handshake lost.");
            }
        } catch(error) {
            handleRuntimeError(error);
        }
    }, 300);
});

document.getElementById("clock-btn").addEventListener("click", ()=>{
    window.log("Initiating CMOS Clock Synchronization Sequence...", "#ffd700");
    setTimeout(()=>{
        window.log("SUCCESS: Clock synced to current network time standard.", "#00ff66");
        window.log("Page will reload to secure staging environment...", "#00ff66");
        setTimeout(() => { location.reload(); }, 1000);
    }, 1200);
});
</script>
</body>
</html>
