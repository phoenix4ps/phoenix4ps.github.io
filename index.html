<!DOCTYPE html>
<html lang="en" manifest="psfree_lapse.cache">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHOENIX GAME</title>
    
    <!-- Load stable exploit bundle from Feyzee repository -->
    <script src="./bundle.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }

        body {
            background-image: url('bg.jpg'); 
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 30px;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #ffffff;
            font-size: 32px;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 140, 0, 0.8);
            z-index: 10;
        }

        .subtitle {
            color: #aaaaaa;
            font-size: 16px;
            margin-bottom: 20px;
            letter-spacing: 2px;
            z-index: 10;
        }

        /* Container for the new Interactive Bird Button (Replaced old PS button) */
        .btn-bird-container {
            width: 110px;
            height: 110px;
            z-index: 10;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Styling the new active bird button */
        #jailbreak-btn {
            width: 100%;
            height: 100%;
            background-image: url('click_bird.png'); /* Name your new trigger bird as click_bird.png */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            opacity: 1;
            transition: transform 0.3s ease, filter 0.3s ease;
            filter: drop-shadow(0 0 15px rgba(0, 92, 248, 0.6));
        }

        /* Hover animation when cursor goes over the active trigger bird */
        #jailbreak-btn:not(:disabled):hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 30px rgba(0, 92, 248, 1)) !important;
        }

        /* Disabled state during exploit execution */
        #jailbreak-btn:disabled {
            cursor: not-allowed;
            opacity: 0.3;
            filter: grayscale(100%) drop-shadow(0 0 2px rgba(128, 128, 128, 0.5)) !important;
        }

        /* Static Original Center Bird Container */
        .phoenix-container {
            width: 380px; 
            height: 380px;
            z-index: 1;
            mix-blend-mode: screen; 
            animation: pulse-glow-only 2.5s infinite ease-in-out;
            margin-top: 5px;
        }

        .phoenix-layer {
            width: 100%;
            height: 100%;
            background-image: url('icon0.png'); /* Center static bird icon */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        @keyframes pulse-glow-only {
            0% { filter: drop-shadow(0 0 15px rgba(255, 69, 0, 0.6)); }
            50% { filter: drop-shadow(0 0 45px rgba(255, 69, 0, 0.9)); }
            100% { filter: drop-shadow(0 0 15px rgba(255, 69, 0, 0.6)); }
        }

        .side-wrapper {
            position: fixed;
            top: 40%; 
            display: flex;
            gap: 40px;
            z-index: 5;
        }
        .left-side { left: 5%; }
        .right-side { right: 5%; }

        .ps-icon-side {
            width: 64px;
            height: 64px;
        }

        .tri { filter: drop-shadow(0 0 15px #4caf50); } 
        .squ { filter: drop-shadow(0 0 15px #e91e63); } 
        .cir { filter: drop-shadow(0 0 15px #ff5722); } 
        .cro { filter: drop-shadow(0 0 15px #2196f3); } 

        .writing-layer {
            margin-top: -10px; 
            width: 380px;
            height: auto;
            object-fit: contain;
            z-index: 10;
            filter: drop-shadow(0 0 15px #ffd700) drop-shadow(0 0 25px #ff8c00);
        }

        #console-box {
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            width: 96%;
            height: 140px;
            padding: 15px;
            font-family: monospace;
            font-size: 14px;
            color: #00ffcc;
            z-index: 10;
            border-radius: 12px;
            margin-top: 25px; 
            overflow-y: auto;
            box-sizing: border-box;
        }
    </style>
    <script>
        if (window.applicationCache && window.applicationCache.status === 0) { 
            window.location.replace("cache.html");
        }
    </script>
</head>
<body>

    <h1>PHOENIX HOST</h1>
    <div class="subtitle">7.00 - 9.60</div>

    <!-- The new Top Bird Trigger Button -->
    <div class="btn-bird-container">
        <button id="jailbreak-btn" title="Click this Bird to Exploit"></button>
    </div>

    <!-- The original Static Center Bird -->
    <div class="phoenix-container">
        <div class="phoenix-layer"></div>
    </div>

    <div class="side-wrapper left-side">
        <img src="tri.png" class="ps-icon-side tri">
        <img src="squ.png" class="ps-icon-side squ">
    </div>
    <div class="side-wrapper right-side">
        <img src="cir.png" class="ps-icon-side cir">
        <img src="cro.png" class="ps-icon-side cro">
    </div>

    <img src="wri.png" class="writing-layer">

    <div id="console-box">
        <div id="messages">System Ready. Click the top bird to trigger Jailbreak.</div>
    </div>

    <script>
        const outputConsole = document.getElementById("messages");
        
        window.log = function (msg, color) {
            if (color === undefined) color = "#00ffcc";
            outputConsole.innerHTML += "<div style='color:" + color + "'> > " + msg + "</div>";
            var box = document.getElementById("console-box");
            box.scrollTop = box.scrollHeight;
        };

        window.addEventListener('error', function (event) {
            var reason = event.error;
            var msg = 'Unhandled error: ';
            if (reason) {
                msg += reason + (reason.stack ? '\n' + reason.stack : '');
            } else {
                msg += 'No error object detect.';
            }
            window.log(msg, "red");
            return true;
        });

        var jailbreakBtn = document.getElementById("jailbreak-btn");

        jailbreakBtn.addEventListener("click", function () {
            jailbreakBtn.disabled = true;
            outputConsole.innerHTML = ""; 
            window.log("Initializing PHOENIX Exploit Engine...", "#ffd700");
            
            try {
                doJailBreak();
            } catch (error) {
                window.log("An error occurred during exploit execution: " + error, "red");
                jailbreakBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
