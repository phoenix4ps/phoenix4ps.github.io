<!DOCTYPE html>
<html lang="en" manifest="psfree_lapse.cache">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>PHOENIX HOST - CACHE</title>

<meta name="theme-color" content="#ff6600">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    url('bg.jpg')
    no-repeat center center fixed;

    background-size:cover;

    overflow:hidden;

    font-family:Arial,sans-serif;

    color:white;
}

/* Overlay */

.overlay{

    position:fixed;

    width:100%;
    height:100%;

    background:
    rgba(0,0,0,0.72);

    z-index:1;
}

/* Main */

.container{

    position:relative;

    z-index:2;

    width:100%;

    height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:flex-start;

    padding-top:40px;
}

/* Title */

.title{

    font-size:64px;

    font-weight:bold;

    text-shadow:
    0 0 10px orange,
    0 0 20px orange,
    0 0 40px red;

}

/* Subtitle */

.subtitle{

    margin-top:12px;

    color:#999;

    font-size:24px;

    letter-spacing:3px;
}

/* Phoenix */

.phoenix{

    width:320px;

    margin-top:40px;

    animation:
    glow 2.5s infinite ease-in-out;

    filter:
    drop-shadow(0 0 25px orange);

}

/* Glow */

@keyframes glow{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

    100%{
        transform:scale(1);
    }

}

/* Cache Button */

.cache-btn{

    margin-top:35px;

    padding:
    18px 45px;

    border:none;

    border-radius:18px;

    background:
    linear-gradient(
    90deg,
    #ff6600,
    #ffaa00
    );

    color:white;

    font-size:26px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 0 20px orange;

    transition:0.3s;

}

.cache-btn:hover{

    transform:scale(1.05);

}

/* Status */

#status{

    margin-top:35px;

    font-size:24px;

    color:#00ff99;

    text-shadow:
    0 0 12px #00ff99;

}

/* Footer */

.footer{

    position:absolute;

    bottom:18px;

    width:100%;

    text-align:center;

    color:#666;

    font-size:14px;

    z-index:3;
}

/* Mobile */

@media(max-width:900px){

    .title{
        font-size:42px;
    }

    .subtitle{
        font-size:18px;
    }

    .phoenix{
        width:230px;
    }

    .cache-btn{

        font-size:20px;

        padding:
        14px 28px;
    }

    #status{
        font-size:18px;
    }

}

</style>

</head>

<body>

<div class="overlay"></div>

<div class="container">

    <div class="title">
        PHOENIX HOST
    </div>

    <div class="subtitle">
        CACHE INSTALLER
    </div>

    <img src="icon0.png"
    class="phoenix">

    <button class="cache-btn"
    onclick="installCache()">

    INSTALL CACHE

    </button>

    <div id="status">

    Waiting For Installation...

    </div>

</div>

<div class="footer">

Phoenix Offline Cache System

</div>

<script>

function installCache(){

    document.getElementById(
    "status"
    ).innerHTML =

    "Installing Cache...";

}

window.applicationCache.oncached =
function(){

document.getElementById(
"status"
).innerHTML =

"Cache Installed Successfully";

};

window.applicationCache.onprogress =
function(e){

document.getElementById(
"status"
).innerHTML =

"Caching Files...";

};

window.applicationCache.onerror =
function(){

document.getElementById(
"status"
).innerHTML =

"Cache Already Installed";

};

</script>

</body>
</html>
