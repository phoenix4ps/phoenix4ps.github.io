<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no" manifest="psfree_lapse.cache">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHOENIX GAME - CACHING</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000 !important; }
        body { background-image: url('bgs.jpg') !important; background-size: cover !important; background-position: center !important; background-repeat: no-repeat !important; background-attachment: fixed !important; font-family: 'Segoe UI', sans-serif; color: #fff; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .header-container { text-align: center; margin-bottom: 20px; z-index: 10; }
        .main-title-text { font-size: 1.6rem; font-weight: 900; color: #fff; letter-spacing: 4px; margin: 0; text-shadow: 0 0 10px #00d2ff; }
        .subtitle { font-size: 0.95rem; color: #00d2ff; letter-spacing: 2px; margin: 5px 0 0 0; font-weight: bold; text-shadow: 0 0 5px #00d2ff; font-family: monospace; }
        .frame-container { width: 38.2vw; height: 70vh; background: rgba(0, 0, 0, 0.4) url('images/frame.png') no-repeat center/100% 100%; display: flex; align-items: center; justify-content: center; box-sizing: border-box; position: relative; border-radius: 16px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); }
        .frame-container::before, .frame-container::after { content: ''; position: absolute; top: 2%; left: 2%; right: 2%; bottom: 2%; border: 4px solid transparent; pointer-events: none; animation: neonPulse 3s infinite ease-in-out; }
        .frame-container::before { border-image: linear-gradient(135deg, #00d2ff 0%, #00d2ff 15%, transparent 15%, transparent 85%, #00ffcc 85%, #00ffcc 100%) 1; }
        .frame-container::after { border-image: linear-gradient(225deg, #00ffcc 0%, #00ffcc 15%, transparent 15%, transparent 85%, #00d2ff 85%, #00d2ff 100%) 1; animation-direction: reverse; }
        #console-box { width: 76%; height: 68%; background: rgba(0, 0, 0, 0.65) !important; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 0.85rem; color: #00ffcc; text-align: left; overflow-y: auto; box-sizing: border-box; line-height: 1.4; z-index: 2; border: 2px solid #fff; animation: whiteGlow 3s infinite ease-in-out; white-space: pre-wrap; word-wrap: break-word; }
        #console-box::-webkit-scrollbar { width: 5px; }
        #console-box::-webkit-scrollbar-thumb { background: rgba(0, 255, 204, 0.3); border-radius: 4px; }
        @keyframes neonPulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        @keyframes whiteGlow { 0%, 100% { box-shadow: 0 0 5px #fff; } 50% { box-shadow: 0 0 18px #fff; } }
    </style>
</head>
<body>
    <div class="header-container">
        <h1 class="main-title-text">PHOENIX HOST</h1>
        <div class="subtitle">INSTALLING OFFLINE CACHE</div>
    </div>

    <div class="frame-container">
        <pre id="console-box"></pre>
    </div>

    <script>
        history.replaceState(null, null, 'index.html');
        var histlength = history.length;
        history.go(-histlength);

        const consoleBox = document.getElementById("console-box");

        window.log = (msg) => { 
            consoleBox.textContent += msg + "\n"; 
            consoleBox.scrollTop = consoleBox.scrollHeight;
        };

        function DLProgress(e) {
            const percent = (Math.round((e.loaded / e.total) * 100));
            window.log(`[CACHE] Downloading... ${percent}% complete.`);
        }

        function DisplayCacheProgress() {
            window.log(" ");
            window.log("[SUCCESS] Cache installed successfully.");
            window.log("Page will reload in 3 seconds...");
            setTimeout(function() { window.log("Reloading..."); }, 2000);
            setTimeout(function() { location.reload(); }, 3000);
        }

        window.applicationCache.addEventListener("progress", DLProgress, false);
        window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
        window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };

        document.addEventListener('DOMContentLoaded', () => {
            consoleBox.textContent = ""; 
            window.log("AppCache download initiating...");
            window.log("Please wait, this may take a few seconds.");
        });
    </script>
</body>
</html>
