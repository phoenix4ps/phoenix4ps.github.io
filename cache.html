<!DOCTYPE html>
<html lang="en" manifest="psfree_lapse.cache">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>PHOENIX HOST - CACHE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

body{

    background-image:url('bg.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

}

.overlay{

    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);

}

.container{

    position:relative;
    z-index:5;

    display:flex;
    flex-direction:column;
    align-items:center;

}

.logo{

    width:280px;
    margin-bottom:20px;

    animation:glow 2s infinite alternate;

}

@keyframes glow{

    from{
        filter:
        drop-shadow(0 0 10px orange)
        drop-shadow(0 0 20px red);
    }

    to{
        filter:
        drop-shadow(0 0 25px orange)
        drop-shadow(0 0 50px red);
    }

}

.title{

    color:white;
    font-size:52px;
    font-weight:bold;

    text-shadow:
    0 0 10px orange,
    0 0 25px red;

    margin-bottom:10px;

}

.subtitle{

    color:#999;
    font-size:18px;
    letter-spacing:3px;

    margin-bottom:40px;

}

.status{

    color:#00aaff;
    font-size:24px;
    margin-top:20px;

    animation:blink 1s infinite;

}

@keyframes blink{

    0%{opacity:1;}
    50%{opacity:0.4;}
    100%{opacity:1;}

}

.cache-box{

    width:120px;
    height:120px;

    border-radius:50%;

    border:3px solid #00aaff;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    font-size:22px;
    font-weight:bold;

    box-shadow:
    0 0 20px #00aaff;

}

.footer{

    position:absolute;
    bottom:15px;

    color:#555;
    font-size:14px;

}

</style>

</head>

<body>

<div class="overlay"></div>

<div class="container">

<img src="icon0.png" class="logo">

<div class="title">
PHOENIX HOST
</div>

<div class="subtitle">
CACHE INSTALLER
</div>

<div class="cache-box">
CACHE
</div>

<div class="status" id="status">
Installing Cache...
</div>

</div>

<div class="footer">
Phoenix Auto Cache System
</div>

<script>

window.applicationCache.oncached = function(){

    document.getElementById("status").innerHTML =
    "Cache Installed Successfully";

}

window.applicationCache.onprogress = function(e){

    document.getElementById("status").innerHTML =
    "Caching Files...";

}

window.applicationCache.onerror = function(){

    document.getElementById("status").innerHTML =
    "Cache Error";

}

</script>

</body>
</html>
