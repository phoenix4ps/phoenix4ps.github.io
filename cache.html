<!DOCTYPE html>
<html lang="en" manifest="psfree_lapse.cache">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHOENIX GAME - CACHING</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0c10;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #ffffff;
        }
        .loading-container {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.8);
            color: #00d2ff;
        }
        .subtitle {
            color: #00ffcc;
            font-size: 1.1rem;
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
        }
        #console-box {
            background-color: rgba(0, 0, 0, 0.75);
            border: 2px solid #ffffff;
            width: 80%;
            max-width: 500px;
            height: 140px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #00ffcc;
            border-radius: 12px;
            overflow-y: auto;
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            animation: whiteGlowPulse 3s infinite ease-in-out;
        }
        @keyframes whiteGlowPulse {
            0%, 100% { box-shadow: 0 0 5px #ffffff; }
            50% { box-shadow: 0 0 18px #ffffff; }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <h1>PHOENIX HOST</h1>
        <div class="subtitle">INSTALLING OFFLINE CACHE</div>
    </div>

    <div id="console-box">
        <div id="messages">> Initializing AppCache installation... [0%]</div>
    </div>

    <script>
        const outputConsole = document.getElementById("messages");
        const consoleContainer = document.getElementById("console-box");
        
        function updateCacheProgress(percent, textStatus) {
            window.location.hash = `caching-${percent}%`;
            outputConsole.innerHTML = `<div>> ${textStatus} [${percent}%]</div>`;
            consoleContainer.scrollTop = consoleContainer.scrollHeight;
        }

        function DLProgress(e) {
            if (e.loaded && e.total) {
                const percent = (Math.round((e.loaded / e.total) * 100));
                updateCacheProgress(percent, "Downloading system files");
            } else {
                outputConsole.innerHTML = "<div>> Storing files in progress...</div>";
            }
        }

        function DisplayCacheProgress() {
            window.location.hash = "cache-success";
            outputConsole.innerHTML = "<div>> Offline Cache installed successfully.</div><div style='color:#00d2ff'>> Redirecting to Home Page...</div>";
            setTimeout(function() { 
                location.replace("index.html"); 
            }, 2000);
        }

        function DisplayCacheError(e) {
            window.location.hash = "cache-error";
            outputConsole.innerHTML = "<div style='color:#ff3333'>> Cache Error: Manifest file missing or invalid.</div>";
        }

        if (window.applicationCache) {
            window.applicationCache.addEventListener("progress", DLProgress, false);
            window.applicationCache.addEventListener("cached", DisplayCacheProgress, false);
            window.applicationCache.addEventListener("updateready", DisplayCacheProgress, false);
            window.applicationCache.addEventListener("noupdate", DisplayCacheProgress, false);
            window.applicationCache.addEventListener("error", DisplayCacheError, false);
        }
    </script>
</body>
</html>
