<!DOCTYPE html>
<html lang="en" manifest="psfree_lapse.cache">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHOENIX GAME - CACHING</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        .cache-page-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            max-width: 600px;
            margin-top: 10px;
            gap: 20px;
        }

        .cache-phoenix-container {
            width: 180px;
            height: 180px;
            z-index: 1;
            mix-blend-mode: screen;
            animation: cache-pulse 2.5s infinite ease-in-out;
        }

        .cache-phoenix-layer {
            width: 100%;
            height: 100%;
            background-image: url('icon0.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 0 15px #ff8c00) drop-shadow(0 0 30px #ff4500);
        }

        #console {
            position: relative;
            width: 92%;
            max-width: 550px;
            height: 150px;
            border: 2px solid rgba(0, 255, 255, 0.8);
            border-radius: 4px;
            background: rgba(4, 12, 24, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.25), inset 0 0 15px rgba(0, 255, 255, 0.1);
            padding: 15px 20px;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #00ffff;
            overflow-y: auto;
            text-align: left;
            white-space: pre-wrap;
            margin: 0;
        }

        #console::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255, 100, 0, 0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        @keyframes cache-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
    </style>
</head>
<body>

    <h1>PHOENIX HOST</h1>
    <div class="subtitle">Installing Offline Storage...</div>

    <div class="cache-page-layout">
        <div class="cache-phoenix-container">
            <div class="cache-phoenix-layer"></div>
        </div>

        <pre id="console"></pre>
    </div>

    <script>
        const outputConsole = document.getElementById("console");
        
        window.log = (msg) => { 
            outputConsole.textContent += "> " + msg + "\n"; 
            outputConsole.scrollTop = outputConsole.scrollHeight;
        };

        function DLProgress(e) {
            const percent = (Math.round((e.loaded / e.total) * 100));
            outputConsole.textContent = `> [CACHE] Downloading assets... ${percent}% complete.`;
        }

        function DisplayCacheProgress() {
            window.log(" ");
            window.log("[SUCCESS] Offline storage deployed successfully.");
            window.log("Launching PHOENIX Environment in 3 seconds...");
            
            setTimeout(function() { window.log("Redirecting system core..."); }, 1500);
            setTimeout(function() { window.location.replace("index.html"); }, 3000);
        }

        if(window.applicationCache) {
            window.applicationCache.addEventListener("progress", DLProgress, false);
            window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
            window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };
        }

        document.addEventListener('DOMContentLoaded', () => {
            outputConsole.textContent = "";
            window.log("AppCache storage sequence initiating...");
            window.log("Please wait, locking data inside PS4 browser memory.");
        });
    </script>
</body>
</html>
