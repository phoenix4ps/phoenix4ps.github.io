<!DOCTYPE html>
<html lang="en" manifest="psfree_lapse.cache">
<head>
    <meta charset="utf-8">
    <title>PHOENIX GAME - CACHING TEST</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0a0a0f; }
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 30px; font-family: Arial, sans-serif;
        }
        h1 { color: #ffffff; font-size: 32px; margin: 0; text-transform: uppercase; text-shadow: 0 0 15px rgba(255, 140, 0, 0.8); z-index: 10; }
        .subtitle { color: #aaaaaa; font-size: 16px; margin-bottom: 15px; letter-spacing: 2px; z-index: 10; }
        
        /* ======================================= */
        /* RESPONSIVE PHOENIX LOGO FOR CACHE PAGE  */
        /* ======================================= */
        .phoenix-container { 
            width: 30vw;         
            max-width: 220px;    
            min-width: 140px;    
            height: auto; 
            aspect-ratio: 1 / 1; 
            z-index: 1; 
            mix-blend-mode: screen; 
            animation: pulse-glow-only 2.5s infinite ease-in-out; 
            margin: 3vh auto;    
            border: 2px dashed #ff8c00; 
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff8c00;
            font-weight: bold;
        }

        @keyframes pulse-glow-only { 0% { filter: drop-shadow(0 0 15px rgba(255, 140, 0, 0.6)); } 50% { filter: drop-shadow(0 0 35px rgba(255, 140, 0, 0.9)); } 100% { filter: drop-shadow(0 0 15px rgba(255, 140, 0, 0.6)); } }

        /* ======================================= */
        /* CACHE LOG CONSOLE CONFIGURATION         */
        /* ======================================= */
        #console {
            font-family: monospace; 
            background-color: rgba(30, 30, 30, 0.3); 
            color: #ffd700;
            border: none;
            border-bottom: 2px solid #ff8c00; 
            padding: 12px; 
            border-radius: 0 0 12px 12px; 
            width: 90%; 
            height: 140px;
            margin-top: 20px; 
            text-align: left; 
            overflow-y: auto; 
            box-sizing: border-box;
            box-shadow: 0px 12px 20px -6px rgba(255, 140, 0, 0.4);
        }
    </style>
</head>
<body>
    <h1>PHOENIX HOST</h1>
    <div class="subtitle">Installing Offline Storage (TEST)</div>

    <div class="phoenix-container"> PHOENIX LOGO </div>

    <pre id="console"></pre>

    <script>
        const outputConsole = document.getElementById("console");
        window.log = (msg) => { 
            outputConsole.textContent += msg + "\n"; 
            outputConsole.scrollTop = outputConsole.scrollHeight;
        };

        let percent = 0;
        function simulateCacheDownload() {
            if (percent <= 100) {
                outputConsole.textContent = `[CACHE] Downloading files... ${percent}% complete.`;
                percent += 20;
                setTimeout(simulateCacheDownload, 600);
            } else {
                window.log(" ");
                window.log("[SUCCESS] Offline Cache installed successfully.");
                window.log("Redirecting to index.html in 3 seconds...");
                setTimeout(function() { window.location.replace("index.html"); }, 3000);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            outputConsole.textContent = "";
            window.log("AppCache storage sequence initiating...");
            setTimeout(simulateCacheDownload, 1000);
        });
    </script>
</body>
</html>
