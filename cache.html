<!DOCTYPE html>
<html lang="en" manifest="psfree_lapse.cache">
<head>
    <meta charset="utf-8">
    <title>PHOENIX GAME - CACHING</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000000; }
        body {
            background-image: url('bg.jpg'); background-size: cover; background-position: center;
            background-repeat: no-repeat; background-attachment: fixed; display: flex;
            flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 30px; font-family: Arial, sans-serif;
        }
        h1 { color: #ffffff; font-size: 32px; margin: 0; text-transform: uppercase; text-shadow: 0 0 15px rgba(255, 140, 0, 0.8); z-index: 10; }
        .subtitle { color: #aaaaaa; font-size: 16px; margin-bottom: 15px; letter-spacing: 2px; z-index: 10; }
        
        .phoenix-container { 
            width: 30vw;         
            max-width: 220px;    
            min-width: 140px;    
            height: auto; 
            aspect-ratio: 1 / 1; 
            z-index: 1; 
            mix-blend-mode: screen; 
            animation: pulse-glow-only 2.5s infinite ease-in-out; 
            margin: 3vh auto;    
        }

        .phoenix-layer { 
            width: 100%; 
            height: 100%; 
            background-image: url('icon0.png'); 
            background-size: contain; 
            background-repeat: no-repeat; 
            background-position: center; 
        }

        @keyframes pulse-glow-only { 0% { filter: drop-shadow(0 0 15px rgba(255, 140, 0, 0.6)); } 50% { filter: drop-shadow(0 0 35px rgba(255, 140, 0, 0.9)); } 100% { filter: drop-shadow(0 0 15px rgba(255, 140, 0, 0.6)); } }

        /* Modified with light transparency to display bg.jpg wall clearly */
        #console {
            font-family: monospace; 
            background: linear-gradient(to top, rgba(0,0,0,0.35) 20%, rgba(0,0,0,0.15) 55%, rgba(0,0,0,0) 100%);
            backdrop-filter: blur(5px);
            color: #ffd700;
            border: none;
            border-bottom: 2px solid #ff8c00; 
            padding: 12px; 
            width: 90%; 
            height: 140px;
            margin-top: 20px; 
            text-align: left; 
            overflow-y: auto; 
            box-sizing: border-box;
            box-shadow: 0px 12px 20px -6px rgba(255, 140, 0, 0.4);
        }
    </style>
</head>
<body>
    <h1>PHOENIX HOST</h1>
    <div class="subtitle">Installing Offline Storage...</div>

    <div class="phoenix-container">
        <div class="phoenix-layer"></div>
    </div>

    <pre id="console"></pre>

    <script>
        const outputConsole = document.getElementById("console");
        window.log = (msg) => { 
            outputConsole.textContent += msg + "\n"; 
            outputConsole.scrollTop = outputConsole.scrollHeight;
        };

        function DLProgress(e) {
            const percent = (Math.round((e.loaded / e.total) * 100));
            outputConsole.textContent = `[CACHE] Downloading files... ${percent}% complete.`;
        }

        function DisplayCacheProgress() {
            window.log(" ");
            window.log("[SUCCESS] Offline Cache installed successfully.");
            window.log("Launching PHOENIX Exploit in 3 seconds...");
            
            setTimeout(function() { window.log("Redirecting..."); }, 1500);
            setTimeout(function() { window.location.replace("index.html"); }, 3000);
        }

        if(window.applicationCache) {
            window.applicationCache.addEventListener("progress", DLProgress, false);
            window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
            window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };
        }

        document.addEventListener('DOMContentLoaded', () => {
            outputConsole.textContent = "";
            window.log("AppCache storage sequence initiating...");
            window.log("Please wait, storing data inside PS4 browser memory.");
        });
    </script>
</body>
</html>
