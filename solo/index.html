<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOENIX HOST</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('images/bgs.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .main-layout {
            display: flex;
            width: 100%;
            height: 100vh;
            box-sizing: border-box;
        }

        .right-section {
            flex: 61.8;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
        }

        .main-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            width: 100%;
            height: 100%;
        }

        .logo-container {
            text-align: center;
            will-change: transform;
            animation: floatAnimation 4s infinite ease-in-out;
        }

        .main-title-img {
            max-width: 85%;
            height: auto;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #00d2ff;
            letter-spacing: 3px;
            margin-top: 10px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
            font-family: monospace;
        }

        .action-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .btn-bird-trigger {
            width: 150px;
            height: 150px;
            object-fit: contain;
            cursor: pointer;
            border-radius: 50%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        .btn-bird-trigger:hover, .btn-bird-trigger:focus {
            transform: scale(1.05) translate3d(0,0,0);
            box-shadow: 0 0 25px #00d2ff, inset 0 0 15px #00ffcc;
            outline: none;
        }

        .left-section {
            flex: 38.2;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .frame-container {
            width: 100%;
            height: 85%;
            background-image: url('images/frame.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            position: relative;
        }

        .frame-container::before {
            content: '';
            position: absolute;
            top: 4%; 
            left: 4%; 
            right: 4%; 
            bottom: 4%; 
            border: 3px dashed #00d2ff; 
            border-image: linear-gradient(to bottom right, #00d2ff 0%, transparent 30%, #00ffcc 50%, transparent 70%, #00d2ff 100%) 1;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4), inset 0 0 15px rgba(0, 255, 204, 0.2);
            pointer-events: none;
            will-change: opacity;
            animation: systemPulse 3s infinite alternate ease-in-out;
        }

        #logger {
            width: 76%;  
            height: 68%; 
            background: rgba(0, 0, 0, 0.6); 
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            color: #00ffcc; 
            text-align: left;
            overflow-y: auto; 
            box-sizing: border-box;
            line-height: 1.6;
            z-index: 2;
        }

        #logger::-webkit-scrollbar {
            width: 6px;
        }

        #logger::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 204, 0.3);
            border-radius: 4px;
        }

        @keyframes floatAnimation {
            0%, 100% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(0, -6px, 0); }
        }

        @keyframes systemPulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <div class="right-section">
            <div class="main-controls">
                
                <div class="logo-container">
                    <img src="images/wris.png" alt="PHOENIX HOST" class="main-title-img">
                    <div class="subtitle">7.00 - 9.60</div>
                </div>

                <div class="action-container">
                    <img src="images/click_bird.png" alt="CLICK BIRD" class="btn-bird-trigger" id="clickBirdBtn" tabindex="0">
                </div>

            </div>
        </div>

        <div class="left-section">
            <div class="frame-container">
                <div id="logger">
                    STATUS: Ready.<br>
                    > Awaiting exploit trigger...
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="js/main.mjs"></script>

    <script>
        function log(message) {
            const logger = document.getElementById('logger');
            logger.innerHTML += "<br>> " + message;
            logger.scrollTop = logger.scrollHeight;
        }
    </script>
</body>
</html>
