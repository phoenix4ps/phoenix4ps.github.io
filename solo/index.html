<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOENIX HOST</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('images/bgs.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .main-layout {
            display: flex;
            width: 100%;
            height: 100vh;
            box-sizing: border-box;
        }

        .left-section {
            flex: 38.2;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .frame-container {
            width: 100%;
            height: 85%;
            background-image: url('images/frame.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            position: relative;
        }

        .frame-container::before {
            content: '';
            position: absolute;
            top: 2%;
            left: 2%;
            right: 2%;
            bottom: 2%;
            border: 4px solid transparent;
            border-image: linear-gradient(135deg, 
                #00d2ff 0%, 
                transparent 20%, 
                transparent 40%, 
                #00ffcc 55%, 
                transparent 70%, 
                #00d2ff 85%, 
                transparent 100%
            ) 1;
            pointer-events: none;
            will-change: opacity;
            animation: randomNeonPulse 4s infinite ease-in-out;
        }

        .frame-container::after {
            content: '';
            position: absolute;
            top: 2%;
            left: 2%;
            right: 2%;
            bottom: 2%;
            border: 4px solid transparent;
            border-image: linear-gradient(315deg, 
                transparent 15%, 
                #00ffcc 35%, 
                transparent 50%, 
                transparent 75%, 
                #00d2ff 90%, 
                transparent 100%
            ) 1;
            pointer-events: none;
            will-change: opacity;
            animation: randomNeonPulse 5s infinite ease-in-out reverse;
        }

            width: 76%;  
            height: 68%;
