<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOENIX HOST</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('images/bgs.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.65);
            padding: 40px 60px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 162, 255, 0.2);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
            max-width: 90%;
            width: 500px;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 10px #00a2ff, 0 0 20px #00a2ff, 0 0 40px #00a2ff;
        }

        .subtitle {
            font-size: 1.6rem;
            margin-top: 5px;
            margin: 0;
            color: #00d2ff;
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PHOENIX HOST</h1>
        <div class="subtitle">7.00 - 9.60</div>
    </div>

</body>
</html>
