<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOENIX HOST</title>
    <!-- Future External CSS Link: <link rel="stylesheet" href="css/style.css"> -->
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('images/bgs.jpg'); /* Subfolder path for background */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Split Background Layout Layer */
        .layout-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            z-index: 1;
        }

        /* Right Section (Golden Ratio 61.8%) */
        .layer-right {
            flex: 61.8;
            height: 100%;
        }

        /* Left Section (Golden Ratio 38.2%) */
        .layer-left {
            flex: 38.2;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            background-image: url('images/frame.png'); /* Subfolder path for frame */
            background-size: 90% 85%;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Logger Textbox styled neatly inside the frame image */
        #logger {
            width: 75%;
            height: 65%;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            color: #00ffcc;
            text-align: left;
            overflow-y: auto;
            box-sizing: border-box;
            line-height: 1.5;
        }

        /* Main Centered Foreground UI Layer */
        .main-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            padding: 20px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.65);
            padding: 40px 60px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 162, 255, 0.2);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
            max-width: 90%;
            width: 500px;
            pointer-events: auto;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 10px #00a2ff, 0 0 20px #00a2ff, 0 0 40px #00a2ff;
        }

        .subtitle {
            font-size: 1.6rem;
            margin-top: 5px;
            margin-bottom: 30px;
            color: #00d2ff;
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.6);
        }

        .btn-trigger {
            background: rgba(0, 162, 255, 0.1);
            border: 2px solid #00d2ff;
            border-radius: 8px;
            color: #fff;
            padding: 15px 40px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px rgba(0, 162, 255, 0.2);
            width: 100%;
            box-sizing: border-box;
        }

        .btn-trigger:hover, .btn-trigger:focus {
            background: #00d2ff;
            color: #000;
            box-shadow: 0 0 20px #00d2ff, 0 0 40px #00d2ff;
            transform: scale(1.03);
            outline: none;
        }
    </style>
</head>
<body>

    <!-- Split Layout Layer -->
    <div class="layout-grid">
        <div class="layer-right"></div>
        <div class="layer-left">
            <!-- Text Box located inside the frame -->
            <div id="logger">STATUS: Ready.<br>> Awaiting exploit trigger...</div>
        </div>
    </div>

    <!-- Centered Content Layer -->
    <div class="main-content">
        <div class="container">
            <h1>PHOENIX HOST</h1>
            <div class="subtitle">7.00 - 9.60</div>
            <button class="btn-trigger" id="clickBirdBtn">Click Bird</button>
        </div>
    </div>

    <script>
        // Log function to handle offline jailbreak status messaging
        function log(message) {
            const logger = document.getElementById('logger');
            logger.innerHTML += "<br>> " + message;
            logger.scrollTop = logger.scrollHeight;
        }
    </script>
</body>
</html>
